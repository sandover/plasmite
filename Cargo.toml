[package]
name = "plasmite"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "Persistent JSON message queues backed by plain files for local and remote IPC"
repository = "https://github.com/sandover/plasmite"
readme = "README-crate.md"
build = "build.rs"
keywords = ["ipc", "queue", "json", "messaging", "pubsub"]
categories = ["command-line-utilities", "development-tools", "data-structures"]

[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }_{ version }_linux_amd64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }_{ version }_darwin_amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }_{ version }_darwin_arm64.tar.gz"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "plasmite"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
fs2 = "0.4"
jaq-core = "2"
jaq-parse = "1"
jaq-std = "2"
memmap2 = "0.9"
libc = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = "0.1"
bytes = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
signal-hook = "0.3"
rcgen = "0.12"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service", "http1", "http2"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout"] }
bstr = "1"
getrandom = "0.3"
oauth-as = { version = "0.10.0", default-features = false, features = ["resource-metadata"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }

[features]
default = []

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false
