name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build artifacts for (format: vX.Y.Z)."
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_RUST_TOOLCHAIN: "1.88.0"

jobs:
  release-context:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ctx.outputs.tag }}
      version: ${{ steps.ctx.outputs.version }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: ctx
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ -z "$tag" || "$tag" != v* ]]; then
            echo "error: release tag must use vX.Y.Z format, got '$tag'." >&2
            exit 1
          fi

          if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${tag}" >/dev/null; then
            echo "error: requested tag '${tag}' does not exist on origin." >&2
            echo "hint: create/push the tag first, then rerun release build." >&2
            exit 1
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.tag }}
      - id: source
        name: Resolve checked-out release source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: targets
        name: Validate and render release targets
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/validate_release_targets.sh
          echo "matrix=$(./scripts/render_release_matrix.sh)" >> "$GITHUB_OUTPUT"
      - name: Record release metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ctx.outputs.tag }}"
          version="${{ steps.ctx.outputs.version }}"
          mkdir -p .scratch/release-metadata
          cat > .scratch/release-metadata/metadata.json <<META
          {
            "tag": "${tag}",
            "version": "${version}",
            "source_sha": "${{ steps.source.outputs.sha }}",
            "source_ref": "refs/tags/${tag}",
            "source_run_id": "${GITHUB_RUN_ID}",
            "source_workflow": "${GITHUB_WORKFLOW}"
          }
          META
      - name: Require green ci.yml for release SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          ci_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$RELEASE_SOURCE_SHA" \
            --limit 5 \
            --json headSha,status,conclusion,url)"

          success_url="$(
            jq -r --arg sha "$RELEASE_SOURCE_SHA" '
              map(select(.headSha==$sha and .status=="completed" and .conclusion=="success"))
              | first
              | .url // empty
            ' <<<"$ci_runs"
          )"

          if [[ -z "$success_url" ]]; then
            echo "error: refusing release because ci.yml is not green for commit $RELEASE_SOURCE_SHA." >&2
            echo "hint: wait for CI to complete successfully on this commit, then rerun release." >&2
            jq -r --arg sha "$RELEASE_SOURCE_SHA" '
              map(select(.headSha==$sha))
              | if length == 0 then
                  "ci runs found: none"
                else
                  ("ci runs found:\n" + (map("- status=" + .status + " conclusion=" + (.conclusion // "null") + " url=" + .url) | join("\n")))
                end
            ' <<<"$ci_runs" >&2
            exit 1
          fi

          echo "ci gate passed: $success_url"
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: .scratch/release-metadata/metadata.json
          if-no-files-found: error

  build-platform:
    needs: [release-context]
    runs-on: ${{ matrix.os }}
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-context.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RELEASE_RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install smoke-test tooling
        if: matrix.sdk
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          if [[ "$RUNNER_LABEL" == ubuntu-* ]]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config python3
          else
            brew install pkg-config
          fi
      - name: Install ARMv7 cross compiler and emulator
        if: matrix.armv7_cross
        shell: bash
        run: |
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user-binfmt
          [[ "$(dpkg-query -W -f='${Version}' libc6-armhf-cross)" == 2.35* ]]
          sudo update-binfmts --enable qemu-arm
          grep -q '^enabled$' /proc/sys/fs/binfmt_misc/qemu-arm
      - name: Pin macOS native deployment targets
        if: matrix.sdk_platform == 'darwin_amd64' || matrix.sdk_platform == 'darwin_arm64'
        shell: bash
        run: |
          if [[ "${{ matrix.sdk_platform }}" == darwin_amd64 ]]; then
            echo 'MACOSX_DEPLOYMENT_TARGET=10.12' >> "$GITHUB_ENV"
          else
            echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
          fi
      - name: Check ARM64 libc build baseline
        if: matrix.sdk_platform == 'linux_arm64'
        shell: bash
        run: test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
      - name: Configure ARMv7 C and Rust linkers
        if: matrix.armv7_cross
        shell: bash
        run: |
          {
            echo 'CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc'
            echo 'AR_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar'
            echo 'CFLAGS_armv7_unknown_linux_gnueabihf=-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard'
            echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc'
            echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER=qemu-arm -L /usr/arm-linux-gnueabihf'
            echo 'QEMU_LD_PREFIX=/usr/arm-linux-gnueabihf'
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        if: matrix.build_python
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        if: matrix.build_python
        with:
          enable-cache: true
          cache-dependency-glob: bindings/python/pyproject.toml
          cache-local-path: ${{ github.workspace }}/.cache/uv
          cache-suffix: release-${{ matrix.target }}
      - uses: actions/setup-node@v4
        if: matrix.build_node
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: cd bindings/node && npm ci
        if: matrix.build_node
      - name: Build native artifacts once for this platform
        shell: bash
        run: |
          if [[ "${{ matrix.sdk }}" == "true" ]]; then
            ./scripts/build_release_artifacts.sh "${{ matrix.target }}" --static
          else
            ./scripts/build_release_artifacts.sh "${{ matrix.target }}"
          fi
      - name: Build and smoke-test Python wheel
        if: matrix.build_python
        shell: bash
        env:
          PLASMITE_SDK_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
        run: ./scripts/python_wheel_smoke.sh
      - uses: actions/upload-artifact@v4
        if: matrix.upload_wheel
        with:
          name: py-dist-${{ matrix.sdk_platform }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.upload_sdist
        with:
          name: py-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error
      - name: Package SDK
        if: matrix.sdk
        shell: bash
        run: ./scripts/package_release_sdk.sh "${{ matrix.target }}" "${{ needs.release-context.outputs.version }}"
      - name: Smoke test packaged SDK
        if: matrix.sdk
        shell: bash
        run: ./scripts/cross_artifact_smoke.sh "dist/plasmite_${{ needs.release-context.outputs.version }}_${{ matrix.sdk_platform }}.tar.gz" "${{ matrix.target }}"
      - name: Run ARM runtime suites
        if: matrix.sdk_platform == 'linux_arm64' || matrix.armv7_cross
        shell: bash
        run: |
          cargo test --release --target "${{ matrix.target }}" \
            --lib \
            --test cli_pool \
            --test secure_serving \
            --test secure_sharing \
            --test oauth_access \
            --test access_lifecycle \
            --test remote_integration \
            -- --test-threads=1
      - name: Check shared pools across 64-bit and ARMv7 CLIs
        if: matrix.armv7_cross
        shell: bash
        run: |
          cargo build --release --bin plasmite
          ./scripts/arm_pool_compatibility.sh \
            target/release/plasmite \
            target/armv7-unknown-linux-gnueabihf/release/plasmite
      - uses: actions/upload-artifact@v4
        if: matrix.sdk
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - name: Build Node addon
        if: matrix.build_node
        env:
          PLASMITE_LIB_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
        run: cd bindings/node && npm run build
      - name: Stage node native payload
        if: matrix.build_node
        shell: bash
        run: ./scripts/package_node_natives.sh "${{ matrix.target }}" "${{ github.workspace }}/target/${{ matrix.target }}/release" "${{ github.workspace }}/bindings/node/index.node"
      - name: Windows node pack/install smoke
        if: matrix.node_platform == 'win32-x64'
        shell: bash
        env:
          PLASMITE_SDK_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
        run: ./scripts/node_pack_smoke.sh
      - uses: actions/upload-artifact@v4
        if: matrix.build_node
        with:
          name: node-native-${{ matrix.node_platform }}
          path: bindings/node/native/${{ matrix.node_platform }}/*
          if-no-files-found: error

  build-node-dist:
    needs: [release-context, build-platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: cd bindings/node && npm ci
      - uses: actions/download-artifact@v4
        with:
          name: node-native-linux-x64
          path: bindings/node/native/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: node-native-darwin-x64
          path: bindings/node/native/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: node-native-darwin-arm64
          path: bindings/node/native/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: node-native-win32-x64
          path: bindings/node/native/win32-x64
      - name: Restore native CLI execute bits
        run: find bindings/node/native -type f -name plasmite -exec chmod +x {} +
      - name: Report assembled platforms
        run: |
          echo "Assembled platforms:"
          ls -la bindings/node/native/
          for dir in bindings/node/native/*/; do
            echo "  $(basename "$dir"): $(find "$dir" -maxdepth 1 -type f | wc -l) files"
          done
      - name: npm pack + install smoke (linux-x64 runtime)
        run: |
          tarball="$(cd bindings/node && npm pack --ignore-scripts --silent)"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"; rm -f "bindings/node/${tarball}"' EXIT
          cd "$workdir"
          npm init -y >/dev/null
          npm install "${GITHUB_WORKSPACE}/bindings/node/${tarball}" >/dev/null
          node -e 'const { Client, Durability, RemoteClient } = require("plasmite"); const os = require("node:os"); const fs = require("node:fs"); const path = require("node:path"); const dir = fs.mkdtempSync(path.join(os.tmpdir(), "plasmite-node-release-")); const c = new Client(dir); const p = c.createPool("smoke", 1024*1024); p.appendJson(Buffer.from("{\"kind\":\"smoke\"}"), ["smoke"], Durability.Fast); p.close(); c.close(); const rc = new RemoteClient("http://127.0.0.1:9700"); if (!rc) throw new Error("missing remote");'
          npx plasmite --version >/dev/null
          mkdir -p "${GITHUB_WORKSPACE}/bindings/node/dist"
          cp "${GITHUB_WORKSPACE}/bindings/node/${tarball}" "${GITHUB_WORKSPACE}/bindings/node/dist/"
      - name: Build npm publish artifact
        run: ls -la bindings/node/dist
      - uses: actions/upload-artifact@v4
        with:
          name: node-dist
          path: bindings/node/dist/plasmite-*.tgz
          if-no-files-found: error
