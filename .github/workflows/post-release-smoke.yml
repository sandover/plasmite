name: post-release-smoke

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to verify (format: X.Y.Z)"
        required: true
        type: string
      channels:
        description: "Optional Linux registry channels; blank checks channels supported by the release"
        required: false
        default: ""
        type: string
      max_wait_minutes:
        description: "Retry budget in minutes"
        required: false
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  delivery-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.release_version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Run post-release delivery smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLASMITE_KEEP_SCRATCH: "1"
          VERSION: ${{ inputs.release_version }}
          CHANNELS: ${{ inputs.channels }}
          MAX_WAIT_MINUTES: ${{ inputs.max_wait_minutes }}
        run: |
          set -euo pipefail
          channels="${CHANNELS:-npm,crates}"
          if [[ -z "$CHANNELS" ]] && jq -e '.targets[] | select(.rust_target == "x86_64-unknown-linux-gnu" and .channels.pypi == "official")' release/targets.json >/dev/null; then
            channels="$channels,pypi"
          fi
          bash scripts/post_release_delivery_smoke.sh \
            --version "$VERSION" \
            --channels "$channels" \
            --max-wait-minutes "$MAX_WAIT_MINUTES"

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-release-smoke-${{ github.run_id }}
          path: .scratch/post-release-smoke-*
          if-no-files-found: ignore

  pypi-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.release_version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install and run the published Python wheel
        shell: bash
        env:
          VERSION: ${{ inputs.release_version }}
          MAX_WAIT_MINUTES: ${{ inputs.max_wait_minutes }}
        run: |
          bash scripts/post_release_delivery_smoke.sh \
            --version "$VERSION" --channels pypi \
            --max-wait-minutes "$MAX_WAIT_MINUTES"

  homebrew-smoke:
    runs-on: macos-latest
    steps:
      - name: Install the released Homebrew formula
        shell: bash
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          brew install sandover/tap/plasmite
          actual="$(plasmite --version)"
          if [[ "$actual" != "plasmite $VERSION" ]]; then
            echo "error: expected plasmite $VERSION from Homebrew, got '$actual'." >&2
            exit 1
          fi
