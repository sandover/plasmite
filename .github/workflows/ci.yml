name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  lite3-upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the pinned Lite3 revision
        run: ./scripts/check-lite3-upstream.sh

  lite3-sanitizers:
    needs: [pr-paths]
    if: >-
      always()
      && github.event_name != 'schedule'
      && (github.event_name != 'pull_request'
          || needs.pr-paths.outputs.lite3 == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the Lite3 boundary with ASan and UBSan
        run: ./scripts/test-lite3-sanitizers.sh

  pr-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      lite3: ${{ steps.filter.outputs.lite3 }}
      packaging: ${{ steps.filter.outputs.packaging }}
      windows: ${{ steps.filter.outputs.windows }}
      boundary: ${{ steps.filter.outputs.boundary }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lite3:
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'c/**'
              - 'vendor/lite3*'
              - 'src/core/lite3/**'
              - 'scripts/test-lite3-sanitizers.sh'
              - 'scripts/abi_adversarial.sh'
              - 'tests/abi_adversarial.c'
              - 'src/abi.rs'
              - 'include/**'
              - '.github/workflows/ci.yml'
            packaging:
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'c/**'
              - 'vendor/lite3/**'
              - 'bindings/**'
              - 'release/**'
              - 'scripts/build_release_artifacts.sh'
              - 'scripts/normalize_sdk_layout.sh'
              - 'scripts/package_node_natives.sh'
              - 'scripts/package_release_sdk.sh'
              - 'scripts/python_wheel_smoke.sh'
              - 'scripts/node_pack_smoke.sh'
              - 'include/**'
              - 'src/abi.rs'
              - 'tests/abi_adversarial.c'
              - 'scripts/abi_adversarial.sh'
              - '.github/workflows/**'
            windows:
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'c/**'
              - 'vendor/lite3/**'
              - 'src/abi.rs'
              - 'src/serve.rs'
              - 'src/serve_init.rs'
              - 'src/cli/**'
              - 'tests/cli_serve_remote.rs'
              - 'src/core/lite3/**'
              - 'include/**'
              - 'bindings/node/**'
              - 'bindings/python/**'
              - 'release/**'
              - 'scripts/build_release_artifacts.sh'
              - 'scripts/package_node_natives.sh'
              - 'scripts/python_wheel_smoke.sh'
              - 'scripts/node_pack_smoke.sh'
              - '.github/workflows/**'
            boundary:
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/abi.rs'
              - 'src/api/**'
              - 'src/core/**'
              - 'c/**'
              - 'vendor/lite3/**'
              - 'include/**'
              - 'bindings/**'
              - 'conformance/**'
              - 'tests/abi_adversarial.c'
              - 'scripts/abi_smoke.sh'
              - 'scripts/abi_adversarial.sh'
              - 'scripts/conformance_all.sh'
              - 'scripts/node_pack_smoke.sh'
              - 'scripts/node_remote_only_smoke.sh'
              - 'Justfile'
              - '.github/workflows/ci.yml'

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check

  dist-smoke:
    needs: [pr-paths]
    if: github.event_name == 'pull_request' && needs.pr-paths.outputs.packaging == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: bindings/python/pyproject.toml
          cache-local-path: ${{ runner.temp }}/uv-cache
          cache-suffix: ${{ matrix.target }}
      - run: cd bindings/node && npm ci
      - name: Build SDK artifacts for packaging smoke
        shell: bash
        run: ./scripts/build_release_artifacts.sh "${{ matrix.target }}"
      - name: Node npm pack/install smoke
        env:
          PLASMITE_SDK_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
        run: ./scripts/node_pack_smoke.sh
      - name: Node remote-only smoke
        run: ./scripts/node_remote_only_smoke.sh
      - name: Python wheel build/install smoke
        env:
          PLASMITE_SDK_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: ./scripts/python_wheel_smoke.sh

  boundary-contracts:
    needs: [pr-paths]
    if: github.event_name == 'pull_request' && needs.pr-paths.outputs.boundary == 'true'
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: bindings/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: cd bindings/node && npm ci
      - name: Run ABI, conformance, and binding contracts
        run: just abi-smoke conformance-all bindings-test

  windows-smoke:
    needs: [pr-paths]
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.pr-paths.outputs.windows == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --bins
      - name: Smoke CLI version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\target\release\plasmite.exe --version
      - name: Verify owner-only serve credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = ".scratch/windows-serve-init"
          $exe = ".\target\release\plasmite.exe"
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          & $exe serve init --host pools.example.test --output-dir $dir | Out-Null
          $currentSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $allowedSids = @($currentSid, "S-1-5-18", "S-1-5-32-544")
          foreach ($name in @("plasmite-auth-token.txt", "plasmite-tls-key.pem")) {
            $path = Join-Path $dir $name
            $acl = Get-Acl -LiteralPath $path
            if (-not $acl.AreAccessRulesProtected) {
              throw "$name still inherits access rules"
            }
            $allowSids = @($acl.Access | Where-Object {
              $_.AccessControlType -eq "Allow"
            } | ForEach-Object {
              $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
            })
            $otherAllows = @($allowSids | Where-Object {
              $_ -notin $allowedSids -and $_ -notmatch '^S-1-5-5-\d+-\d+$'
            })
            if ($otherAllows.Count -ne 0) {
              throw "$name permits unrelated SID(s): $($otherAllows -join ', ')"
            }
            if ($currentSid -notin $allowSids) {
              throw "$name does not permit the creating account"
            }
          }
          & $exe serve --token-file (Join-Path $dir "plasmite-auth-token.txt") --tls-cert (Join-Path $dir "plasmite-tls-cert.pem") --tls-key (Join-Path $dir "plasmite-tls-key.pem") check | Out-Null
          $unsafe = Join-Path $dir "unsafe-token.txt"
          Set-Content -LiteralPath $unsafe -Value "not-printed" -NoNewline
          icacls.exe $unsafe /inheritance:e | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          & $exe serve --token-file $unsafe check 2>$null | Out-Null
          $unsafeExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($unsafeExit -eq 0) {
            throw "serve accepted a token with inherited Windows ACLs"
          }
          exit 0
      - name: Local pool roundtrip smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = ".scratch/windows-smoke"
          $pool = "ci-smoke"
          $exe = ".\target\release\plasmite.exe"
          $payloadPath = "$dir\payload.json"
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path $payloadPath -Value '{"ci":"windows-smoke"}' -NoNewline
          & $exe --dir $dir pool create $pool
          & $exe --dir $dir feed $pool -f $payloadPath
          $out = & $exe --dir $dir follow $pool --tail 1 --one --timeout 2s --data-only --format jsonl
          if (-not ($out -match '"ci":"windows-smoke"')) {
            throw "Roundtrip payload marker missing from follow output."
          }

  full:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: bindings/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: bindings/python/pyproject.toml
          cache-local-path: ${{ github.workspace }}/.cache/uv
          cache-suffix: full-${{ runner.os }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: cd bindings/node && npm ci
      - run: just release-gate

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: just audit
