name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  lite3-upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the pinned Lite3 revision
        run: ./scripts/check-lite3-upstream.sh

  lite3-sanitizers:
    needs: [pr-paths]
    if: >-
      always()
      && github.event_name != 'schedule'
      && (github.event_name != 'pull_request'
          || needs.pr-paths.outputs.lite3 == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the Lite3 boundary with ASan and UBSan
        run: ./scripts/test-lite3-sanitizers.sh

  pr-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      lite3: ${{ steps.filter.outputs.lite3 }}
      packaging: ${{ steps.filter.outputs.packaging }}
      arm: ${{ steps.filter.outputs.arm }}
      windows: ${{ steps.filter.outputs.windows }}
      boundary: ${{ steps.filter.outputs.boundary }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lite3:
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'c/**'
              - 'vendor/lite3*'
              - 'src/core/lite3/**'
              - 'scripts/test-lite3-sanitizers.sh'
              - 'scripts/abi_adversarial.sh'
              - 'tests/abi_adversarial.c'
              - 'src/abi.rs'
              - 'include/**'
              - '.github/workflows/ci.yml'
            packaging:
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'c/**'
              - 'vendor/lite3/**'
              - 'bindings/**'
              - 'release/**'
              - 'scripts/build_release_artifacts.sh'
              - 'scripts/normalize_sdk_layout.sh'
              - 'scripts/package_node_natives.sh'
              - 'scripts/package_release_sdk.sh'
              - 'scripts/python_wheel_smoke.sh'
              - 'scripts/node_pack_smoke.sh'
              - 'scripts/packaged_serve_smoke.py'
              - 'include/**'
              - 'src/abi.rs'
              - 'tests/abi_adversarial.c'
              - 'scripts/abi_adversarial.sh'
              - '.github/workflows/**'
            arm:
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'c/**'
              - 'vendor/lite3/**'
              - 'src/**'
              - 'tests/**'
              - 'include/**'
              - 'release/**'
              - 'scripts/build_release_artifacts.sh'
              - 'scripts/package_release_sdk.sh'
              - 'scripts/cross_artifact_smoke.sh'
              - 'scripts/arm_pool_compatibility.sh'
              - 'scripts/packaged_serve_smoke.py'
              - 'scripts/validate_release_targets.sh'
              - 'scripts/render_release_matrix.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            windows:
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'c/**'
              - 'vendor/lite3/**'
              - 'src/**'
              - 'tests/**'
              - 'include/**'
              - 'bindings/node/**'
              - 'bindings/python/**'
              - 'release/**'
              - 'scripts/build_release_artifacts.sh'
              - 'scripts/package_node_natives.sh'
              - 'scripts/python_wheel_smoke.sh'
              - 'scripts/node_pack_smoke.sh'
              - 'scripts/packaged_serve_smoke.py'
              - '.github/workflows/**'
            boundary:
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/abi.rs'
              - 'src/api/**'
              - 'src/core/**'
              - 'c/**'
              - 'vendor/lite3/**'
              - 'include/**'
              - 'bindings/**'
              - 'conformance/**'
              - 'tests/abi_adversarial.c'
              - 'scripts/abi_smoke.sh'
              - 'scripts/abi_adversarial.sh'
              - 'scripts/conformance_all.sh'
              - 'scripts/node_pack_smoke.sh'
              - 'scripts/node_remote_only_smoke.sh'
              - 'Justfile'
              - '.github/workflows/ci.yml'

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check

  dist-smoke:
    needs: [pr-paths]
    if: github.event_name == 'pull_request' && needs.pr-paths.outputs.packaging == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: bindings/python/pyproject.toml
          cache-local-path: ${{ runner.temp }}/uv-cache
          cache-suffix: ${{ matrix.target }}
      - run: cd bindings/node && npm ci
      - name: Build SDK artifacts for packaging smoke
        shell: bash
        run: ./scripts/build_release_artifacts.sh "${{ matrix.target }}"
      - name: Node npm pack/install smoke
        env:
          PLASMITE_SDK_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
        run: ./scripts/node_pack_smoke.sh
      - name: Node remote-only smoke
        run: ./scripts/node_remote_only_smoke.sh
      - name: Python wheel build/install smoke
        env:
          PLASMITE_SDK_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: ./scripts/python_wheel_smoke.sh

  arm-sdk-smoke:
    needs: [pr-paths]
    if: >-
      always()
      && github.event_name != 'schedule'
      && (github.event_name != 'pull_request' || needs.pr-paths.outputs.arm == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            platform: linux_armv7
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install SDK smoke tools
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config python3
          if [[ "$TARGET" == armv7-* ]]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user-binfmt
            [[ "$(dpkg-query -W -f='${Version}' libc6-armhf-cross)" == 2.35* ]]
            sudo update-binfmts --enable qemu-arm
            grep -q '^enabled$' /proc/sys/fs/binfmt_misc/qemu-arm
            {
              echo 'CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc'
              echo 'AR_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar'
              echo 'CFLAGS_armv7_unknown_linux_gnueabihf=-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard'
              echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc'
              echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER=qemu-arm -L /usr/arm-linux-gnueabihf'
              echo 'QEMU_LD_PREFIX=/usr/arm-linux-gnueabihf'
            } >> "$GITHUB_ENV"
          else
            test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
          fi
      - name: Build and smoke SDK archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "plasmite") | .version')"
          ./scripts/build_release_artifacts.sh "${{ matrix.target }}" --static
          ./scripts/package_release_sdk.sh "${{ matrix.target }}" "$version"
          ./scripts/cross_artifact_smoke.sh "dist/plasmite_${version}_${{ matrix.platform }}.tar.gz" "${{ matrix.target }}"
          (cd dist && sha256sum "plasmite_${version}_${{ matrix.platform }}.tar.gz" > sha256sums.txt)
          jq -n --arg source_sha "$(git rev-parse HEAD)" \
            --arg version "$version" --arg target "${{ matrix.target }}" \
            '{source_sha: $source_sha, version: $version, target: $target}' > dist/ci-build.json
      - name: Run ARM runtime suites
        run: |
          cargo test --release --target "${{ matrix.target }}" \
            --lib \
            --test cli_pool \
            --test secure_serving \
            --test secure_sharing \
            --test oauth_access \
            --test access_lifecycle \
            --test remote_integration \
            -- --test-threads=1
      - name: Check shared pools across 64-bit and ARMv7 CLIs
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        shell: bash
        run: |
          cargo build --release --bin plasmite
          ./scripts/arm_pool_compatibility.sh \
            target/release/plasmite \
            target/armv7-unknown-linux-gnueabihf/release/plasmite

      - name: Preserve verified ARM SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: ci-sdk-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/sha256sums.txt
            dist/ci-build.json
          if-no-files-found: error
          retention-days: 30

  boundary-contracts:
    needs: [pr-paths]
    if: github.event_name == 'pull_request' && needs.pr-paths.outputs.boundary == 'true'
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: bindings/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: cd bindings/node && npm ci
      - name: Run ABI, conformance, and binding contracts
        run: just abi-smoke conformance-all bindings-test

  windows-smoke:
    needs: [pr-paths]
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.pr-paths.outputs.windows == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Lint Windows targets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo clippy --release --all-targets -- -D warnings
      - name: Build release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --bins
      - name: Smoke CLI version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\target\release\plasmite.exe --version
      - name: Check private state and secure sharing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --release --lib windows_private::tests -- --test-threads=1
          cargo test --release --test secure_sharing --test access_lifecycle --test browser_access --test oauth_access -- --test-threads=1
      - name: Local pool roundtrip smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = ".scratch/windows-smoke"
          $pool = "ci-smoke"
          $exe = ".\target\release\plasmite.exe"
          $payloadPath = "$dir\payload.json"
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path $payloadPath -Value '{"ci":"windows-smoke"}' -NoNewline
          try {
            & $exe --dir $dir pool create $pool
            & $exe --dir $dir feed $pool -f $payloadPath
            $out = & $exe --dir $dir follow $pool --tail 1 --one --timeout 2s --data-only --format jsonl
            if (-not ($out -match '"ci":"windows-smoke"')) {
              throw "Roundtrip payload marker missing from follow output."
            }
          } finally {
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          }

  full:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: bindings/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: bindings/python/pyproject.toml
          cache-local-path: ${{ github.workspace }}/.cache/uv
          cache-suffix: full-${{ runner.os }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: cd bindings/node && npm ci
      - run: just release-gate

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: just audit
