<!--
Purpose: Live map of the pools in one served directory.
Role: Browser client for the pool change stream and each pool's event stream.
Invariants: Each pool is a spiral track whose length is its message buffer,
  with byte 0 at 12 o'clock on the outside. It takes one turn, or more when one
  circle is too short to show each message apart. The track ends at 12 o'clock
  on its innermost turn, and a vertical leg joins it back to the start, where
  writing wraps. Turns sit evenly, close together. The newest message's index
  sits level outside the spiral, joined to that message by a thin line. Each
  stored message is drawn at its real offset and size when the server supplies
  frames. Otherwise the occupied bytes form a continuous span. The newest five
  percent of the ring brightens toward the write head.
Invariants: Pools pack as circles in name order, each at the highest free candidate. Layout changes only when the
  pool set or the window width changes. A track's shape comes from its pool's
  size, so data never moves it.
  Tracks never shrink while the page is open. The message card floats over the map and
  never moves pools.
Invariants: Message data enters the DOM as text.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plasmite Map</title>
    <style>
      @font-face {
        font-family: "Inconsolata";
        src: url("/ui/assets/inconsolata.woff2") format("woff2");
        font-weight: 200 900;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        --bg: #15191f;
        --panel-raised: #27313e;
        --line: #394657;
        --text: #e9edf1;
        --muted: #9aa9b8;
        --accent: #83c5d7;
        --ok: #74d7b2;
        --warn: #e8bc72;
        --error: #f08383;
        --spot: #ffd166;
        --head: #e6f6fa;
        --numbers: "Inconsolata", "Menlo", "Consolas", monospace;
        --ease: .35s ease;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 30% -20%, #263543, transparent 55%), var(--bg);
        color: var(--text);
        font: 15px/1.45 "Menlo", "Consolas", "DejaVu Sans Mono", monospace;
      }
      a { color: var(--accent); }
      button { font: inherit; cursor: pointer; }
      .shell { min-height: 100vh; display: flex; flex-direction: column; }
      .topbar {
        display: flex; align-items: center; gap: 22px;
        padding: 10px 18px; border-bottom: 1px solid var(--line); background: #1a2028;
      }
      .brand { color: var(--text); font-size: 14px; letter-spacing: .11em; text-decoration: none; }
      .topbar nav { display: flex; gap: 16px; }
      .topbar nav a { text-decoration: none; color: var(--muted); }
      .topbar nav a[aria-current="page"] { color: var(--text); }
      .topbar .status { margin-left: auto; color: var(--muted); font-size: 12px; }
      .topbar .actions { margin-left: auto; font-size: 12px; }
      .topbar .status + .actions { margin-left: 0; }
      .topbar .actions a { text-decoration: none; }
      .topbar .actions button { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; }
      @media (max-width: 540px) {
        .topbar { flex-wrap: wrap; column-gap: 16px; row-gap: 4px; }
        .topbar .status { order: 3; width: 100%; margin-left: 0; }
        .topbar .status + .actions { margin-left: auto; }
      }
      .map-scroll { flex: 1; overflow: auto; padding: 16px; }
      .map { position: relative; margin: 0 auto; }
      .map, .machine, .directory, .pool, .peek { transition: left var(--ease), top var(--ease), width var(--ease), height var(--ease); }
      .machine, .directory { position: absolute; }
      .machine { border: 1px solid #6d8592; background: #1c2832e8; border-radius: 18px; }
      .directory { border: 1px solid #547382; background: #22313b; border-radius: 13px; }
      .group-label { position: absolute; top: 10px; left: 16px; right: 16px; display: flex; gap: 10px; align-items: baseline; font-size: 12px; }
      .group-label strong { font-weight: 600; }
      .machine > .group-label { color: var(--muted); }
      .path {
        display: flex; min-width: 0; padding: 1px 4px; margin: -1px -4px; border: 0; border-radius: 5px;
        background: none; color: var(--text); font-size: 12px; white-space: nowrap;
      }
      .path .parent { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
      .path strong { flex: none; }
      .path:hover, .path:focus-visible { background: var(--panel-raised); outline: none; }
      .copied { color: var(--ok); font-size: 11px; }
      .empty { position: absolute; display: grid; place-items: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }

      .pool {
        position: absolute; display: grid; place-items: center;
        padding: 0; border: 0; background: none; color: var(--text); pointer-events: none; animation: appear var(--ease);
      }
      .pool > * { grid-area: 1 / 1; }
      /* The stable disc takes presses even when circles' rectangular boxes overlap. */
      .pool .hit { width: var(--hit-diameter); height: var(--hit-diameter); border-radius: 50%; pointer-events: auto; }
      .pool .label { display: flex; flex-direction: column; align-items: center; gap: 1px; pointer-events: none; }
      @keyframes appear { from { opacity: 0; transform: scale(.94); } }
      .pool svg { display: block; overflow: visible; }
      .pool .track { fill: none; stroke: #16202a; }
      .pool .leg { stroke: #3a4a5a; stroke-width: 1.5; }
      .pool .leader { stroke: var(--head); stroke-width: 1; opacity: .75; }
      .pool .arc { fill: none; stroke: var(--accent); }
      .pool .spot { fill: none; stroke: var(--spot); }
      .pool .pointer { fill: var(--spot); filter: drop-shadow(0 0 3px #ffd16680); }
      .pool .head { fill: none; stroke: var(--head); }
      .pool .index { fill: var(--text); font-family: var(--numbers); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
      .pool .name, .pool .meta { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .pool .name { font-size: 13px; line-height: 1.2; }
      .pool .meta { color: var(--muted); font-family: var(--numbers); font-size: 11px; }
      .pool:hover .track, .pool:focus-visible .track { stroke: #1b2631; }
      .pool:focus-visible { outline: none; }
      .pool:focus-visible .name { text-decoration: underline; }
      .pool[aria-expanded="true"] .name { color: var(--ok); }
      .activity-button {
        position: absolute; z-index: 2; transform: translateX(-50%); display: flex; align-items: center;
        justify-content: center; gap: 4px; min-width: 40px; height: 20px; padding: 2px 5px;
        border: 0; border-radius: 6px; background: none; color: var(--muted); font: 11px var(--numbers);
      }
      .activity-button:hover, .activity-button:focus-visible { background: var(--panel-raised); color: var(--text); outline: none; }
      .activity-mark { display: inline-block; width: 5px; height: 5px; border: 1px solid currentColor; border-radius: 50%; }
      .activity-mark.local { background: currentColor; }
      .activity-mark.browser { border-radius: 1px; }
      .activity-mark.mcp { border-radius: 0; transform: rotate(45deg); }
      .activity-card[hidden] { display: none; }
      .activity-card {
        position: fixed; z-index: 10; overflow: auto;
        width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0;
        background: #1a2028; color: var(--text); border: 1px solid #526578; border-radius: 12px;
        box-shadow: 0 10px 40px #0008; font-size: 12px;
      }
      .activity-heading { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
      .activity-list { padding: 4px 16px; }
      .activity-machine { margin: 12px 0 4px; color: var(--accent); font-weight: normal; font-size: 12px; overflow-wrap: anywhere; }
      .activity-list > section + section { border-top: 1px solid var(--line); margin-top: 10px; }
      .activity-context { color: var(--muted); font-size: 11px; margin: 6px 0; }
      .activity-row { padding: 6px 0; }
      .activity-row small { display: block; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
      .activity-client { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

      .peek {
        position: absolute; z-index: 3; display: flex; flex-direction: column; animation: appear var(--ease);
        background: #1a2028; border: 1px solid #526578; border-radius: 12px; box-shadow: 0 10px 30px #0b0f1499;
      }
      .peek::before {
        content: ""; position: absolute; top: -7px; left: calc(var(--pointer, 50%) - 7px); width: 12px; height: 12px;
        background: #1a2028; border: solid #526578; border-width: 1px 0 0 1px; transform: rotate(45deg);
        transition: left var(--ease);
      }
      .message-head, .message { display: grid; grid-template-columns: 46px minmax(0, 1fr) 52px; gap: 8px; align-items: baseline; }
      .message-head { padding: 6px 12px 5px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10px; }
      .message-head span:last-child { text-align: right; }
      .messages { overflow: auto; flex: 1; min-height: 0; padding: 4px 6px; }
      .messages:empty::before { content: "–"; display: block; padding: 8px 6px; color: var(--muted); font-size: 12px; }
      .message { padding: 3px 6px; border-radius: 5px; font-size: 11px; line-height: 1.35; }
      .message:hover { background: #222b35; }
      .message .kind { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--accent); font-size: 10px; }
      .message .kind[data-tone="warn"] { color: var(--warn); }
      .message .kind[data-tone="error"] { color: var(--error); }
      .message .text { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .message time { text-align: right; color: var(--muted); font-size: 10px; }
      .more {
        display: block; padding: 8px 14px; border-top: 1px solid var(--line); border-radius: 0 0 12px 12px;
        font-size: 11px; text-decoration: none;
      }
      .more:hover, .more:focus-visible { background: var(--panel-raised); outline: none; }
      .tip {
        position: fixed; z-index: 10; max-width: min(460px, calc(100vw - 24px)); padding: 8px 10px; pointer-events: none;
        background: #0f1419; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px #0009;
        font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
      }
      .tip small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
      .status-error { color: var(--error); }
      .map-error { color: var(--error); padding: 0 24px; }
      .map-error:empty { display: none; }

      @media (prefers-reduced-motion: reduce) {
        .map, .machine, .directory, .pool, .peek { transition: none; }
        .pool, .peek { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/ui/map">PLASMITE</a>
        <nav aria-label="Views">
          <a href="/ui/map" aria-current="page">Map</a>
          <a href="/ui">Pools</a>
        </nav>
        <span class="status" id="status">Connecting…</span>
        <span class="actions" id="actions"></span>
      </header>
      <div class="map-scroll" id="map-scroll">
        <div class="map" id="map">
          <section class="machine" id="machine">
            <div class="group-label"><strong id="machine-name"></strong></div>
            <section class="directory" id="directory">
              <div class="group-label">
                <button type="button" class="path" id="path" aria-label="Copy directory path"><span class="parent"></span><strong></strong></button>
                <span class="copied" id="copied" hidden>copied</span>
              </div>
              <div class="empty" id="empty" hidden>No pools</div>
              <section class="peek" id="peek" aria-label="Messages" hidden>
                <div class="message-head"><span>Type</span><span>Message</span><span>Time</span></div>
                <div class="messages" id="messages" aria-live="polite"></div>
                <a class="more" id="open" href="/ui">Recent messages →</a>
              </section>
            </section>
          </section>
        </div>
      </div>
      <p class="map-error" id="map-error" role="alert"></p>
      <div class="tip" id="tip" role="tooltip" hidden></div>
      <section class="activity-card" id="activity-card" aria-labelledby="activity-title" hidden>
        <div class="activity-heading"><strong id="activity-title"></strong></div>
        <div class="activity-list" id="activity-list"></div>
      </section>
    </main>
    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const scroll = $("map-scroll");
        const messages = $("messages");
        const cards = new Map();
        const activityButtons = new Map();
        let activity = null;
        let activityPool = null;
        let activityTimer = null;
        let activityController = null;
        let activityAllowed = true;
        const shapes = new Map();
        const stroke = 7;
        const compactPitch = 10;
        const maxOuter = 240;
        const maxInner = 56;
        // Ring bytes of the smallest possible message, {}, as stored: frame header,
        // encoded payload, and commit marker.
        const minFrameBytes = 480;
        const standardBytes = 1048576;
        const bigScale = 1.5;
        const radiusStep = 8;
        const minSegment = 1;
        const trailBands = 8;
        const trailFraction = 0.05;
        const indexRoom = { x: 40, y: 26 };
        const peekWidth = 360;
        const emptySize = { width: 240, height: 70 };
        const machinePad = { top: 36, side: 14, bottom: 14 };
        const directoryPad = { top: 40, side: 18, bottom: 16 };
        const gutter = 10;
        const indexClearance = 24;
        const maxMessages = 200;
        const retryMs = 1200;
        const state = { pools: [], topology: null, layout: null,
          selected: null, spotSeq: null, nextSeq: null, stopReader: null, stopList: null, requested: null };
        let resizeTimer = null;

        // Numbers and text.

        function size(bytes) {
          if (!Number.isFinite(bytes)) return "–";
          const units = ["B", "KB", "MB", "GB", "TB"];
          let value = bytes, unit = 0;
          while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
          return (unit ? Number(value.toFixed(1)) : value) + " " + units[unit];
        }

        function shortCount(count) {
          if (count < 10000) return String(count);
          if (count < 1000000) return (count / 1000).toFixed(count < 100000 ? 1 : 0) + "k";
          return (count / 1000000).toFixed(1) + "M";
        }

        // Rounds so a nearly empty pool never reads as 0% and a nearly full one never reads as 100%.
        function percentLabel(fraction) {
          const percent = fraction * 100;
          if (percent > 0 && percent < 1) return "<1%";
          if (percent > 99 && percent < 100) return ">99%";
          return Math.round(percent) + "%";
        }

        function usedFraction(pool) {
          const used = pool.metrics && pool.metrics.utilization && pool.metrics.utilization.used_percent;
          return Number.isFinite(used) ? Math.min(1, Math.max(0, used / 100)) : 0;
        }

        function messageCount(pool) {
          const count = pool.metrics && pool.metrics.message_count;
          return Number.isFinite(count) ? count : 0;
        }

        // Track shape.

        const measure = document.createElement("canvas").getContext("2d");
        function textWidth(text, px, family) {
          measure.font = px + "px " + family;
          return measure.measureText(text).width;
        }

        // Smallest ring whose inside fits the two label lines. Each line sits about
        // 9 px from the center, where the circle is narrower than its diameter. The
        // size line is measured at its widest ("100%"), so the percent never resizes it.
        function labelRadius(pool) {
          const body = getComputedStyle(document.body).fontFamily;
          const numbers = getComputedStyle(document.documentElement).getPropertyValue("--numbers");
          const width = Math.max(textWidth(pool.name, 13, body), textWidth(size(pool.file_size) + " · 100%", 11, numbers)) + 10;
          return Math.hypot(width / 2, 22) + stroke / 2 + 3;
        }

        // The largest outer radius that fits the map's width, and no more than maxOuter.
        function outerCap() {
          const width = scroll.clientWidth - 32 - 2 * (machinePad.side + directoryPad.side + indexRoom.x);
          return Math.max(0, Math.min(maxOuter, width / 2 - stroke));
        }

        // Whole turns that give a message of minFrameBytes minSegment px in a ring of
        // ringBytes. A spiral from inner + compactPitch * t down to inner is about
        // pi * t * (2 * inner + compactPitch * t) long.
        function turnsFor(inner, ringBytes) {
          const needed = ringBytes * minSegment / minFrameBytes;
          if (needed <= 2 * Math.PI * inner) return 1;
          const a = Math.PI * compactPitch, b = 2 * Math.PI * inner;
          return Math.max(2, Math.ceil((-b + Math.sqrt(b * b + 4 * a * needed)) / (2 * a)));
        }

        // Every pool shares one center, sized for the longest label on the map up to
        // maxInner; longer names are cut short. So a pool's size depends only on its
        // capacity, and pools compare at a glance.
        function sharedInner(pools) {
          const widest = Math.max(0, ...pools.map(labelRadius));
          return Math.min(maxInner, Math.ceil(widest / radiusStep) * radiusStep);
        }

        // A track's shape comes from the pool's size, never its contents, so a pool
        // keeps its shape as messages come and go, and bigger pools look bigger.
        // Every track is a spiral from 12 o'clock on the outside, with as many turns
        // as it takes for the smallest possible message to get minSegment px. A
        // pool bigger than the standard 1 MB grows to at most 1.5 times the standard
        // pool's radius; past that, messages can be narrower than a pixel. The map's
        // width caps it too.
        function trackShape(pool, inner) {
          const standardRing = standardBytes * pool.ring_size / pool.file_size;
          const standardOuter = inner + compactPitch * turnsFor(inner, standardRing);
          const largest = Math.min(standardOuter * bigScale, outerCap());
          const most = Math.max(1, Math.floor((largest - inner) / compactPitch));
          const turns = Math.min(turnsFor(inner, pool.ring_size), most);
          const prior = shapes.get(pool.name);
          return { inner, turns: Math.max(turns, prior ? prior.turns : 1) };
        }

        // Leaves room around the track for the index beside its newest message.
        function nodeSize(pool) {
          const d = 2 * (pool.track.outer + stroke);
          return { width: d + 2 * indexRoom.x, height: d + 2 * indexRoom.y };
        }

        // The track as points about 2 px apart, from 12 o'clock clockwise, with the
        // distance along the track to each point. Turn k steps inward by drops[k],
        // and the track ends at 12 o'clock on its innermost turn, so the leg back to
        // the start is vertical.
        // Sampling a long spiral is the costly step, and its shape rarely changes, so
        // each inner radius and set of pitches is sampled once.
        const sampled = new Map();
        function sampleTrack(inner, drops) {
          const key = inner + ":" + drops.join(",");
          if (!sampled.has(key)) {
            if (sampled.size > 64) sampled.clear();
            sampled.set(key, sampleFresh(inner, drops));
          }
          return sampled.get(key);
        }

        function sampleFresh(inner, drops) {
          const startRadius = drops.map((_, k) => inner + drops.slice(k).reduce((sum, step) => sum + step, 0));
          const outer = startRadius[0];
          const c = outer + stroke;
          const sweep = 2 * Math.PI * drops.length;
          const count = Math.max(96, Math.ceil(sweep * outer / 2));
          const points = [];
          const lengths = [];
          let total = 0;
          for (let i = 0; i <= count; i++) {
            const theta = sweep * i / count;
            const turn = Math.min(drops.length - 1, Math.floor(theta / (2 * Math.PI)));
            const r = startRadius[turn] - drops[turn] * (theta / (2 * Math.PI) - turn);
            const point = { x: c + r * Math.sin(theta), y: c - r * Math.cos(theta), r, theta };
            if (i) total += Math.hypot(point.x - points[i - 1].x, point.y - points[i - 1].y);
            points.push(point);
            lengths.push(total);
          }
          const d = "M" + points.map((p) => p.x.toFixed(1) + " " + p.y.toFixed(1)).join("L");
          return { c, outer, inner, drops, points, lengths, total, d };
        }

        // Where the newest message ends, in ring bytes; the head when there is no list.
        function newestEnd(pool) {
          const list = frames(pool);
          const newest = list && list.length ? list[list.length - 1] : null;
          return newest ? newest[0] + newest[1] : (pool.ring ? pool.ring.head : 0);
        }

        // Every turn sits compactPitch inside the one before it.
        function layTrack(pool) {
          const { inner, turns } = pool.shape;
          return sampleTrack(inner, Array(turns).fill(compactPitch));
        }

        // The point at a distance along the track, with its radius and angle.
        function pointAt(track, distance) {
          const { points, lengths } = track;
          const target = Math.min(Math.max(distance, 0), track.total);
          let low = 0, high = lengths.length - 1;
          while (high - low > 1) {
            const mid = (low + high) >> 1;
            if (lengths[mid] < target) low = mid; else high = mid;
          }
          const span = lengths[high] - lengths[low] || 1;
          const f = (target - lengths[low]) / span;
          const [a, b] = [points[low], points[high]];
          return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, r: a.r + (b.r - a.r) * f, theta: a.theta + (b.theta - a.theta) * f };
        }

        // Track geometry, in pixels along the track from 12 o'clock.

        // Stored frames as [offset, bytes] pairs, oldest first, or null when the
        // server sent no list (too many frames, or a writer kept changing the ring).
        function frames(pool) {
          return pool.ring && Array.isArray(pool.ring.frames) ? pool.ring.frames : null;
        }

        // The drawn part of one frame. Frames of 3 px and up end a little early,
        // leaving a gap before the next. Shorter ones touch, and alternating shades
        // keep them apart.
        function drawn(offset, bytes, scale) {
          const length = bytes * scale;
          const gap = length >= 3 ? Math.min(1, length * 0.3) : 0;
          return { start: offset * scale, end: offset * scale + Math.max(0.5, length - gap) };
        }

        // Pixel intervals for ring bytes [from, to), which may run past the end of
        // the ring and continue from byte 0.
        function byteIntervals(from, to, size, scale) {
          const start = ((from % size) + size) % size;
          const end = start + (to - from);
          return end <= size
            ? [{ start: start * scale, end: end * scale }]
            : [{ start: start * scale, end: size * scale }, { start: 0, end: (end - size) * scale }];
        }

        // A quiet occupied track and a short trail behind the write head. The
        // trail covers at most five percent of the ring, even when the pool is full.
        // Exact frame gaps survive when the server can list individual frames.
        function trailLayers(pool, scale) {
          const ring = pool.ring;
          if (!ring || !messageCount(pool)) return { occupied: [], bands: [], head: [] };
          const size = pool.ring_size;
          const used = (ring.head - ring.tail + size) % size || size;
          const end = ring.tail + used;
          const list = frames(pool);
          const pieces = list && list.map(([offset, bytes]) => drawn(offset, bytes, scale));
          const occupied = pieces || byteIntervals(ring.tail, end, size, scale);
          const span = Math.min(used, size * trailFraction);
          const regions = Array.from({ length: trailBands }, (_, i) => byteIntervals(
            end - span + span * i / trailBands, end - span + span * (i + 1) / trailBands, size, scale));
          const bands = regions.map((region, i) => ({ intervals: pieces ? [] : region,
            opacity: 0.9 * (i + 1) / trailBands }));
          if (pieces) {
            for (const piece of pieces) {
              for (let i = 0; i < trailBands; i++) {
                for (const part of regions[i]) {
                  const start = Math.max(piece.start, part.start), stop = Math.min(piece.end, part.end);
                  if (stop > start) bands[i].intervals.push({ start, end: stop });
                }
              }
            }
          }
          const head = pieces ? pieces.slice(-1) : byteIntervals(end - Math.min(used, 2 / scale), end, size, scale);
          return { occupied, bands, head };
        }

        // Where one stored message sits, matched by sequence number against the
        // ring's own first frame. Null when it is gone or there is no frame list.
        function segmentOf(pool, seq, scale) {
          const list = frames(pool);
          const index = seq - (pool.ring && pool.ring.first);
          if (!list || !Number.isInteger(index) || index < 0 || index >= list.length) return null;
          return drawn(list[index][0], list[index][1], scale);
        }

        // Dash pattern that paints the given intervals on a circle whose dash
        // offset 0 is 12 o'clock. Touching intervals merge into one dash.
        function dashes(intervals, circumference) {
          const sorted = intervals.slice().sort((a, b) => a.start - b.start);
          const merged = [];
          for (const interval of sorted) {
            const last = merged[merged.length - 1];
            if (last && interval.start - last.end < 0.01) last.end = Math.max(last.end, interval.end);
            else merged.push({ ...interval });
          }
          if (!merged.length) return "0 " + circumference;
          let out = "0 " + merged[0].start.toFixed(2);
          merged.forEach((interval, i) => {
            const next = i + 1 < merged.length ? merged[i + 1].start : circumference;
            out += " " + (interval.end - interval.start).toFixed(2) + " " + Math.max(0, next - interval.end).toFixed(2);
          });
          return out;
        }

        // Everything the track draws, as numbers. Occupied bytes stay quiet;
        // only the short trail before the head brightens toward the newest. A
        // hovered message turns yellow, with a pointer just outside the track. The
        // newest message's index (#505) sits beside it: outside a ring, or in the
        // gap outside its turn on a spiral, moving to the gap inside if the pointer
        // is near. An empty pool has no index.
        function trackGeometry(pool, spotSeq) {
          const track = pool.track;
          const scale = track.total / pool.ring_size;
          const layers = trailLayers(pool, scale);
          const list = frames(pool);
          const newest = list && list.length ? list[list.length - 1] : null;
          const end = pointAt(track, newestEnd(pool) * scale);
          const spot = segmentOf(pool, spotSeq, scale);
          const spotAt = spot ? pointAt(track, (spot.start + spot.end) / 2) : null;
          // A point at a radius and angle from the center, nudged sideways along the track.
          const polar = (r, theta, side = 0) => [track.c + r * Math.sin(theta) + side * Math.cos(theta),
            track.c - r * Math.cos(theta) + side * Math.sin(theta)];
          // The pointer sits at the rim and points in along the hovered message's
          // angle; the gaps between turns are too narrow to hold it.
          const rim = track.outer + stroke / 2 + 3;
          // The index sits outside the spiral, level, at the newest message's angle.
          // A thin line runs out to it from the newest message. It steps past the
          // pointer when the two meet.
          const near = spotAt && Math.abs(Math.atan2(Math.sin(end.theta - spotAt.theta), Math.cos(end.theta - spotAt.theta))) * rim < 24;
          const indexRadius = near ? rim + 14 : rim + 3;
          const newestSeq = list ? (list.length ? pool.ring.first + list.length - 1 : null) : pool.bounds && pool.bounds.newest;
          const start = track.points[0], last = track.points[track.points.length - 1];
          return {
            track,
            occupied: layers.occupied,
            bands: layers.bands,
            head: layers.head,
            spot,
            pointer: spotAt ? [polar(rim, spotAt.theta), polar(rim + 7, spotAt.theta, -4), polar(rim + 7, spotAt.theta, 4)] : null,
            // From the inner edge of the innermost turn to the outer edge of the
            // outermost, so the seam spans the whole band and ends flush with it.
            leg: [[last.x, last.y + stroke / 2], [start.x, start.y - stroke / 2]],
            index: newestSeq == null ? null : { at: polar(indexRadius, end.theta), theta: end.theta, text: "#" + shortCount(newestSeq),
              leader: [polar(end.r + stroke / 2, end.theta), polar(indexRadius - 2, end.theta)] },
          };
        }

        // SVG markup from track geometry. Every value is a number, except the index
        // text, which is "#", digits, and a unit letter.
        // The track's path is written once, and each layer draws it again by
        // reference with its own dashes, so a long spiral does not repeat its points
        // for every layer. Dash patterns and stroke styles pass through to the shape.
        function trackMarkup(g, id) {
          const t = g.track;
          const path = (className, intervals, opacity = 1) => '<use href="#' + id + '" class="' + className + '"' +
            ' stroke-width="' + stroke + '"' +
            (intervals ? ' stroke-dasharray="' + dashes(intervals, t.total) + '"' : "") +
            (opacity < 1 ? ' opacity="' + opacity.toFixed(2) + '"' : "") + '/>';
          const some = (className, intervals) => intervals.length ? path(className, intervals) : "";
          const fmt = ([x, y]) => x.toFixed(1) + "," + y.toFixed(1);
          // Level text, anchored away from the spiral, at the end of its leader line.
          const label = (index) => {
            const [x, y] = index.at;
            const [[x1, y1], [x2, y2]] = index.leader;
            const leader = '<line class="leader" x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '"/>';
            const sin = Math.sin(index.theta), cos = -Math.cos(index.theta);
            const anchor = sin > 0.3 ? "start" : sin < -0.3 ? "end" : "middle";
            const baseline = cos > 0.3 ? "hanging" : cos < -0.3 ? "auto" : "central";
            return leader + '<text class="index" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="' + anchor +
              '" dominant-baseline="' + baseline + '">' + index.text + '</text>';
          };
          return '<svg width="' + 2 * t.c + '" height="' + 2 * t.c + '" aria-hidden="true">' +
            '<defs><path id="' + id + '" d="' + t.d + '" pathLength="' + t.total.toFixed(2) + '"/></defs>' +
            path("track", null) +
            path("arc", g.occupied, 0.2) +
            g.bands.map((band) => band.intervals.length ? path("arc", band.intervals, band.opacity) : "").join("") +
            some("head", g.head) +
            // Drawn over the messages, so the seam at 12 o'clock reads as one straight line.
            '<line class="leg" x1="' + g.leg[0][0].toFixed(1) + '" y1="' + g.leg[0][1].toFixed(1) +
              '" x2="' + g.leg[1][0].toFixed(1) + '" y2="' + g.leg[1][1].toFixed(1) + '"/>' +
            (g.spot ? path("spot", [g.spot]) : "") +
            (g.pointer ? '<polygon class="pointer" points="' + g.pointer.map(fmt).join(" ") + '"/>' : "") +
            (g.index ? label(g.index) : "") + '</svg>';
        }

        // Pools.

        function directoryPath() {
          const path = state.pools[0] && state.pools[0].path;
          return path ? path.replace(/[\\/][^\\/]*$/, "") : "";
        }

        function currentPool() {
          return state.pools.find((pool) => pool.name === state.selected);
        }

        function setStatus(text, isError) {
          $("status").textContent = text;
          $("status").classList.toggle("status-error", Boolean(isError));
        }

        function createCard(name) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "pool";
          button.dataset.name = name;
          button.innerHTML = '<span class="ring"></span><span class="label"><span class="name"></span><span class="meta"></span></span><span class="hit"></span>';
          button.querySelector(".name").textContent = name;
          // A click from the keyboard has no position (detail 0) and always counts.
          button.addEventListener("click", (event) => {
            if (event.detail && !onTrack(name, event)) { if (state.selected) closePeek(); return; }
            if (state.selected === name) closePeek(); else openPeek(name);
          });
          return button;
        }

        // Whether a pointer event lands within the pool's spiral, not just its box,
        // which also holds room for the index.
        function onTrack(name, event) {
          const pool = state.pools.find((candidate) => candidate.name === name);
          const button = cards.get(name);
          if (!pool || !button) return false;
          const box = button.getBoundingClientRect();
          const dx = event.clientX - (box.left + box.width / 2), dy = event.clientY - (box.top + box.height / 2);
          return Math.hypot(dx, dy) <= pool.track.outer + stroke;
        }

        // The one way a ring is drawn, from the pool, its new-message count, and the
        // hover. Unchanged markup is left alone: replacing the element under a press
        // would stop the browser from sending its click.
        const drawnMarkup = new Map();
        const trackIds = new Map();
        function drawRing(pool) {
          const button = cards.get(pool.name);
          if (!button) return;
          const spotSeq = pool.name === state.selected ? state.spotSeq : null;
          if (!trackIds.has(pool.name)) trackIds.set(pool.name, "track-" + trackIds.size);
          const markup = trackMarkup(trackGeometry(pool, spotSeq), trackIds.get(pool.name));
          if (drawnMarkup.get(pool.name) === markup) return;
          drawnMarkup.set(pool.name, markup);
          button.querySelector(".ring").innerHTML = markup;
        }

        function updateCard(pool) {
          const button = cards.get(pool.name);
          if (!button) return;
          button.style.setProperty("--hit-diameter", 2 * (pool.track.outer + stroke) + "px");
          drawRing(pool);
          button.querySelector(".label").style.maxWidth = 2 * (pool.shape.inner - stroke) - 6 + "px";
          const used = usedFraction(pool);
          const count = messageCount(pool);
          // Label with the size the pool was created at; usage is a share of its message buffer.
          button.querySelector(".meta").textContent = size(pool.file_size) + " · " + percentLabel(used);
          const utilization = (pool.metrics && pool.metrics.utilization) || {};
          button.title = pool.name + " · " + count.toLocaleString() + (count === 1 ? " message · " : " messages · ") +
            size(utilization.used_bytes) + " used, " + size(utilization.free_bytes) + " free";
          button.setAttribute("aria-label", button.title);
          button.setAttribute("aria-expanded", String(pool.name === state.selected));
        }

        function updateCards() {
          for (const pool of state.pools) updateCard(pool);
        }

        // Activity is a snapshot of open files and server requests, never a
        // complete census of readers. It does not participate in ring layout.
        function updateActivityButtons() {
          for (const [name, button] of activityButtons) {
            const observed = activity && activity.pools && activity.pools[name];
            button.hidden = !activityAllowed || !observed;
            if (!observed) continue;
            const entries = observed.entries || [];
            const partial = !observed.local_files?.available;
            button.replaceChildren();
            for (const entry of entries.slice(0, 3)) {
              const mark = document.createElement("span");
              mark.className = "activity-mark " + (entry.kind === "open_file" ? "local" : entry.kind);
              mark.setAttribute("aria-hidden", "true");
              button.append(mark);
            }
            button.append(entries.length ? String(entries.length) : partial ? "–" : "○");
            const label = name + " activity · " + entries.length + " observed" + (partial ? " · local files unavailable" : "");
            button.setAttribute("aria-label", label);
            button.title = label;
          }
          if (activityPool) { renderActivity(); placeActivity(); }
        }

        function openActivity(name) {
          if (activityPool === name) { closeActivity(); return; }
          activityPool = name;
          renderActivity();
          $("activity-card").hidden = false;
          placeActivity();
        }

        function closeActivity() {
          const focused = $("activity-card").contains(document.activeElement);
          const button = activityButtons.get(activityPool);
          activityPool = null;
          $("activity-card").hidden = true;
          if (focused) button?.focus({ preventScroll: true });
        }

        function placeActivity() {
          const button = activityButtons.get(activityPool);
          if (!button) { closeActivity(); return; }
          const box = button.getBoundingClientRect();
          const card = $("activity-card");
          card.style.left = Math.max(16, Math.min(box.left, window.innerWidth - card.offsetWidth - 16)) + "px";
          card.style.top = Math.max(16, Math.min(box.bottom + 8, window.innerHeight - card.offsetHeight - 16)) + "px";
        }

        function renderActivity() {
          $("activity-title").textContent = "Activity";
          const list = $("activity-list");
          const scroll = list.scrollTop;
          list.replaceChildren();
          const observed = activity?.pools?.[activityPool];
          if (!observed) {
            list.textContent = "Activity unavailable";
            return;
          }
          const entries = observed.entries || [];
          const sections = [
            ["Live requests", entries.filter(entry => entry.kind !== "open_file")],
            ["Local processes", entries.filter(entry => entry.kind === "open_file")],
          ];
          for (const [title, rows] of sections) {
            if (title === "Local processes" && !rows.length) continue;
            const section = document.createElement("section");
            const heading = document.createElement("h3");
            heading.className = "activity-machine";
            heading.textContent = title + (rows.length ? " · " + rows.length : "");
            section.append(heading);
            if (title === "Local processes" && activity.hostname) {
              const host = document.createElement("small");
              host.className = "activity-context";
              host.textContent = activity.hostname;
              section.append(host);
            }
            if (title === "Local processes" && rows.length && !observed.local_files?.available) {
              const coverage = document.createElement("small");
              coverage.className = "activity-context";
              coverage.textContent = "Partial · Inspection unavailable";
              section.append(coverage);
            }
            if (!rows.length) {
              const empty = document.createElement("p");
              empty.className = "activity-context";
              empty.textContent = "None now";
              section.append(empty);
            }
            for (const entry of rows) {
              const row = document.createElement("div");
              row.className = "activity-row";
              const kind = entry.kind === "mcp" ? "MCP" : entry.kind === "browser" ? "Browser" : "HTTP";
              const operation = entry.operation || "";
              const action = operation.includes("/events") || operation.includes("/tail") || operation === "plasmite_wait" ? "Following"
                : operation.includes("feed") || operation.startsWith("POST ") ? "Writing"
                : operation.includes("delete") || operation.startsWith("DELETE ") ? "Deleting" : "Reading";
              row.append(entry.kind === "open_file" ? entry.command || "Process" : kind + " · " + action);
              const detail = document.createElement("small");
              const local = /^(127\.|::1$)/.test(entry.peer_ip || "");
              detail.textContent = entry.kind === "open_file"
                ? "PID " + entry.pid + " · Pool file open"
                : [local ? "Local · " + entry.peer_ip : entry.peer_ip || "Address unavailable",
                    entry.age_ms != null ? Math.floor(entry.age_ms / 1000) + "s active" : ""].filter(Boolean).join(" · ");
              row.append(detail);
              if (entry.kind !== "open_file") {
                const client = document.createElement("small");
                client.className = "activity-client";
                client.textContent = [entry.operation, entry.user_agent].filter(Boolean).join(" · ");
                client.title = client.textContent;
                row.append(client);
              }
              section.append(row);
            }
            list.append(section);
          }
          list.scrollTop = scroll;
        }

        async function refreshActivity() {
          if (!activityAllowed || activityController || document.visibilityState !== "visible") return;
          const controller = new AbortController();
          activityController = controller;
          try {
            const response = await fetch("/v0/ui/activity", { cache: "no-store", signal: controller.signal });
            if (response.status === 403) {
              activityAllowed = false;
              updateActivityButtons();
              return;
            }
            if (!response.ok) throw new Error("Activity unavailable");
            activity = await response.json();
            updateActivityButtons();
          } catch (_) {
            if (!controller.signal.aborted) {
              activity = null;
              updateActivityButtons();
            }
          } finally {
            if (activityController === controller) activityController = null;
            if (activityAllowed && document.visibilityState === "visible") activityTimer = setTimeout(refreshActivity, 5000);
          }
        }

        function stopActivity() {
          clearTimeout(activityTimer);
          activityTimer = null;
          activityController?.abort();
        }

        // Layout.

        // Try the directory sides, circle edges, and gaps between pairs of
        // circles. At each x, take the first free height above any circles there.
        // Their boxes may overlap; only the circular hit areas take presses.
        function pack(boxes, maxWidth) {
          const placed = [];
          let width = 0, height = 0;
          const widestRadius = Math.max(0, ...boxes.map((box) => box.radius + indexClearance + gutter / 2));
          for (const box of boxes) {
            const radius = box.radius + indexClearance + gutter / 2;
            const left = box.width / 2, right = maxWidth - left, top = box.height / 2;
            let best = null;
            const candidates = new Set([left, right]);
            // Only the growing edge needs new anchors. Every placed circle
            // still blocks a candidate, so this cannot create overlaps.
            const edge = placed.filter((other) => other.cy + other.radius >= height - 2 * widestRadius);
            for (const other of edge) {
              const distance = radius + other.radius;
              for (const x of [other.cx - distance, other.cx + distance]) {
                if (x >= left && x <= right) candidates.add(x);
              }
            }
            // Pair gaps at the growing edge add diagonal nesting.
            for (let i = 0; i < edge.length; i++) for (let j = i + 1; j < edge.length; j++) {
              const a = edge[i], b = edge[j];
              const ar = radius + a.radius, br = radius + b.radius;
              const dx = b.cx - a.cx, dy = b.cy - a.cy;
              const distance = Math.hypot(dx, dy);
              if (distance >= ar + br || distance <= Math.abs(ar - br)) continue;
              const along = (ar * ar - br * br + distance * distance) / (2 * distance);
              const across = Math.sqrt(Math.max(0, ar * ar - along * along));
              for (const x of [a.cx + (along * dx - across * dy) / distance,
                a.cx + (along * dx + across * dy) / distance]) {
                if (x >= left && x <= right) candidates.add(x);
              }
            }
            for (const x of candidates) {
              const blocked = [];
              for (const other of placed) {
                const distance = radius + other.radius;
                const dx = x - other.cx;
                if (Math.abs(dx) >= distance) continue;
                const dy = Math.sqrt(distance * distance - dx * dx);
                blocked.push([other.cy - dy, other.cy + dy]);
              }
              blocked.sort((a, b) => a[0] - b[0]);
              let y = top;
              for (const [start, end] of blocked) if (start < y && y < end) y = end;
              if (!best || y < best.y - 0.01 || (Math.abs(y - best.y) < 0.01 && x < best.x)) best = { x, y };
            }
            const at = { ...box, x: best.x - left, y: best.y - top, cx: best.x, cy: best.y, radius };
            placed.push(at);
            width = Math.max(width, at.x + box.width);
            height = Math.max(height, at.y + box.height);
          }
          return { boxes: placed, width, height };
        }

        // Pure: where the machine, the directory, and each pool go, for this width.
        function computeLayout(pools, availableWidth) {
          const nodes = pools.map((pool) => ({ name: pool.name, radius: pool.track.outer + stroke, ...nodeSize(pool) }));
          const maxWidth = Math.max(emptySize.width, availableWidth - 2 * machinePad.side - 2 * directoryPad.side,
            ...nodes.map((node) => node.width));
          const rows = pack(nodes, maxWidth);
          const content = { width: Math.max(rows.width, emptySize.width), height: Math.max(rows.height, emptySize.height) };
          const directory = { x: machinePad.side, y: machinePad.top,
            width: content.width + 2 * directoryPad.side, height: content.height + directoryPad.top + directoryPad.bottom };
          const machine = { width: directory.width + 2 * machinePad.side, height: directory.height + machinePad.top + machinePad.bottom };
          const boxes = new Map(rows.boxes.map((box) => [box.name, { ...box, x: box.x + directoryPad.side, y: box.y + directoryPad.top }]));
          return { machine, directory, boxes };
        }

        function place(element, box) {
          element.style.left = (box.x || 0) + "px";
          element.style.top = (box.y || 0) + "px";
          element.style.width = box.width + "px";
          element.style.height = box.height + "px";
        }

        // Moves existing pools instead of rebuilding them, so CSS can animate the change.
        function applyLayout(layout) {
          state.layout = layout;
          place($("map"), layout.machine);
          place($("machine"), layout.machine);
          place($("directory"), layout.directory);
          place($("empty"), { x: directoryPad.side, y: directoryPad.top, ...emptySize });
          $("empty").hidden = state.pools.length > 0;
          const path = directoryPath();
          const cut = Math.max(path.lastIndexOf("/"), path.lastIndexOf("\\")) + 1;
          $("path").querySelector(".parent").textContent = path.slice(0, cut);
          $("path").querySelector("strong").textContent = path.slice(cut) || "–";
          $("path").title = path;
          for (const [name, button] of cards) {
            if (!layout.boxes.has(name)) {
              button.remove(); cards.delete(name); drawnMarkup.delete(name);
              activityButtons.get(name)?.remove(); activityButtons.delete(name);
            }
          }
          for (const [name, box] of layout.boxes) {
            if (!cards.has(name)) {
              cards.set(name, createCard(name));
              $("directory").append(cards.get(name));
              const button = document.createElement("button");
              button.type = "button";
              button.className = "activity-button";
              button.hidden = true;
              button.addEventListener("click", () => openActivity(name));
              activityButtons.set(name, button);
              $("directory").append(button);
            }
            place(cards.get(name), box);
            const button = activityButtons.get(name);
            button.style.left = (box.x + box.width / 2) + "px";
            button.style.top = (box.y + box.height / 2 + 20) + "px";
          }
          updateActivityButtons();
          placePeek();
        }

        function relayout() {
          state.topology = topology();
          applyLayout(computeLayout(state.pools, scroll.clientWidth - 32));
        }

        function topology() {
          return JSON.stringify(state.pools.map((pool) => [pool.name, pool.shape, pool.track.outer]));
        }

        // Floats the card under the open pool, pointing at its ring, kept inside the directory's sides.
        function placePeek() {
          const box = state.layout && state.layout.boxes.get(state.selected);
          const peek = $("peek");
          peek.hidden = !box;
          if (!box) return;
          const center = box.x + box.width / 2;
          const x = Math.max(directoryPad.side, Math.min(center - peekWidth / 2, state.layout.directory.width - directoryPad.side - peekWidth));
          peek.style.width = peekWidth + "px";
          peek.style.left = x + "px";
          peek.style.top = (box.y + box.height + 10) + "px";
          peek.style.setProperty("--pointer", (center - x) + "px");
          fitPeek();
        }

        // Lets the card reach down to 16 px above the bottom of the window, and no
        // further. Measured from the card's target spot, so a slide in progress
        // does not throw it off.
        function fitPeek() {
          if ($("peek").hidden) return;
          const top = $("directory").getBoundingClientRect().top + parseFloat($("peek").style.top);
          $("peek").style.maxHeight = Math.max(160, innerHeight - top - 16) + "px";
        }

        // Takes one pool snapshot: sizes each ring once, counts new messages since
        // the last snapshot, then lays out and draws.
        function showPools(payload) {
          const pools = (Array.isArray(payload.pools) ? payload.pools : []).slice().sort((a, b) => a.name.localeCompare(b.name));
          const inner = sharedInner(pools);
          const names = new Set(pools.map((pool) => pool.name));
          for (const name of shapes.keys()) if (!names.has(name)) shapes.delete(name);
          for (const pool of pools) {
            pool.shape = trackShape(pool, inner);
            pool.track = layTrack(pool);
            shapes.set(pool.name, pool.shape);
          }
          state.pools = pools;
          if (state.selected && !currentPool()) closePeek();
          if (topology() !== state.topology) relayout();
          updateCards();
          setStatus(pools.length + (pools.length === 1 ? " pool" : " pools"));
          $("map-error").textContent = "";
          if (state.requested) {
            const requested = state.requested;
            state.requested = null;
            if (cards.has(requested)) openPeek(requested);
          }
        }

        // Streams.

        // Splits a server-sent event stream into events as chunks arrive. Returns
        // the complete events and the unfinished remainder.
        function parseEvents(buffer) {
          const blocks = buffer.split("\n\n");
          const rest = blocks.pop() || "";
          const events = [];
          for (const block of blocks) {
            let name = "";
            const data = [];
            for (const line of block.split("\n")) {
              if (line.startsWith("event:")) name = line.slice(6).trim();
              if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
            }
            if (data.length) events.push({ name, data: JSON.parse(data.join("\n")) });
          }
          return { events, rest };
        }

        // Follows a server-sent event stream until the returned stop() is called,
        // reconnecting retryMs after any drop, including a clean close. url() is
        // read on each connect, so a reconnect can resume where the last one ended.
        // Stops for good on 401 (the session ended; sign in again) and on 403 or
        // 404 (nothing here to read).
        function follow(url, onEvent, onDrop = () => {}) {
          const controller = new AbortController();
          let stopped = false;
          (async () => {
            while (!stopped) {
              try {
                const response = await fetch(url(), { cache: "no-store", signal: controller.signal });
                if (response.status === 401) { location.assign("/ui"); return; }
                if (response.status === 403 || response.status === 404) return;
                if (!response.ok || !response.body) throw new Error("Stream failed (" + response.status + ")");
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";
                for (;;) {
                  const part = await reader.read();
                  if (stopped || part.done) break;
                  const parsed = parseEvents(buffer + decoder.decode(part.value, { stream: true }).replaceAll("\r\n", "\n"));
                  buffer = parsed.rest;
                  for (const event of parsed.events) {
                    if (event.name === "error") throw new Error((event.data.error && event.data.error.message) || "Stream error");
                    // A bug in the page's own handling is logged, not treated as a dropped stream.
                    try { onEvent(event); } catch (error) { console.error(error); }
                  }
                }
              } catch (_) { /* The stream dropped or was stopped; reconnect below unless stopped. */ }
              if (stopped) return;
              onDrop();
              await new Promise((resolve) => setTimeout(resolve, retryMs));
            }
          })();
          return () => { stopped = true; controller.abort(); };
        }

        function startList() {
          if (state.stopList || document.visibilityState !== "visible") return;
          state.stopList = follow(() => "/v0/ui/pools/stream",
            (event) => { if (event.name === "pools") showPools(event.data); },
            () => setStatus("reconnecting"));
        }

        function stopList() {
          if (state.stopList) state.stopList();
          state.stopList = null;
        }

        // The server skips messages that were overwritten; that is normal for a
        // ring, so the card shows no notice for it.
        function startReader(name) {
          stopReader();
          state.stopReader = follow(() => {
            const query = new URLSearchParams({ gap_policy: "continue" });
            if (state.nextSeq != null) query.set("since_seq", state.nextSeq);
            return "/v0/ui/pools/" + encodeURIComponent(name) + "/events?" + query;
          }, (event) => { if (event.name === "message") addMessage(event.data); });
        }

        function stopReader() {
          if (state.stopReader) state.stopReader();
          state.stopReader = null;
        }

        // Card.

        function openPeek(name) {
          state.selected = name;
          state.spotSeq = null;
          hover(null);
          const pool = currentPool();
          if (!pool) return;
          const bounds = pool.bounds || {};
          state.nextSeq = bounds.newest == null ? null : Math.max(bounds.oldest || 1, bounds.newest - maxMessages + 1);
          messages.replaceChildren();
          $("peek").setAttribute("aria-label", name + " messages");
          // Reserve message rows before the first tail frame, so the link stays under the pointer.
          $("peek").style.height = (100 + 21 * Math.min(messageCount(pool), 8)) + "px";
          $("open").href = "/ui/pools/" + encodeURIComponent(name);
          updateCards();
          placePeek();
          const url = new URL(location.href);
          url.searchParams.set("pool", name);
          history.replaceState(null, "", url);
          startReader(name);
        }

        function closePeek() {
          const button = cards.get(state.selected);
          const hadFocus = $("peek").contains(document.activeElement);
          stopReader();
          hover(null);
          state.selected = null;
          state.spotSeq = null;
          updateCards();
          placePeek();
          const url = new URL(location.href);
          url.searchParams.delete("pool");
          history.replaceState(null, "", url);
          if (button && hadFocus) button.focus();
        }

        // One line per message: its own text when it has some, else its first fields.
        function summaryText(data) {
          if (typeof data === "string") return data;
          if (!data || typeof data !== "object" || Array.isArray(data)) return JSON.stringify(data);
          if (typeof data.message === "string") return data.message;
          if (typeof data.text === "string") return data.text;
          return Object.entries(data)
            .filter(([key]) => key !== "level" && key !== "kind")
            .map(([key, value]) => key + " " + (typeof value === "object" && value ? JSON.stringify(value) : value))
            .join(" · ");
        }

        function kindOf(message) {
          const data = message.data;
          if (data && typeof data === "object" && !Array.isArray(data)) {
            if (typeof data.level === "string") return data.level;
            if (typeof data.kind === "string") return data.kind;
          }
          const tags = (message.meta && message.meta.tags) || [];
          return tags.length ? String(tags[0]) : "";
        }

        function addMessage(message) {
          if (!Number.isFinite(message.seq)) return;
          if (state.nextSeq != null && message.seq < state.nextSeq) return;
          state.nextSeq = message.seq + 1;
          const row = document.createElement("div");
          row.className = "message";
          const when = message.time ? new Date(message.time) : null;
          row.dataset.seq = message.seq;
          row.dataset.detail = "#" + message.seq + (when ? " · " + when.toLocaleString() : "");
          const kind = kindOf(message);
          const badge = document.createElement("span");
          badge.className = "kind";
          badge.textContent = kind;
          if (kind) {
            const tone = kind.toLowerCase();
            if (tone.includes("warn")) badge.dataset.tone = "warn";
            if (tone.includes("error") || tone.includes("fail")) badge.dataset.tone = "error";
          }
          const text = document.createElement("span");
          text.className = "text";
          text.textContent = summaryText(message.data);
          const time = document.createElement("time");
          time.textContent = when ? when.toLocaleTimeString([], { hour12: false }) : "";
          row.append(badge, text, time);
          const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 40;
          messages.append(row);
          while (messages.children.length > maxMessages) {
            if (messages.firstElementChild === hoverRow) hover(null);
            messages.firstElementChild.remove();
          }
          if (nearBottom) messages.scrollTop = messages.scrollHeight;
        }

        // Hover.

        let tipTimer = null;
        function hideTip() {
          clearTimeout(tipTimer);
          $("tip").hidden = true;
        }

        // Marks the hovered message's slice on the open pool's ring.
        function spot(seq) {
          if (state.spotSeq === seq) return;
          state.spotSeq = seq;
          const pool = currentPool();
          if (pool) drawRing(pool);
        }

        // Marks the row under the pointer: its slice on the ring, and after a short
        // wait, a tooltip when its line is cut off. Does nothing if the row is unchanged.
        let hoverRow = null;
        function hover(row) {
          if (row === hoverRow) return;
          hoverRow = row;
          hideTip();
          spot(row ? Number(row.dataset.seq) : null);
          if (!row) return;
          const text = row.querySelector(".text");
          if (text.scrollWidth <= text.clientWidth) return;
          tipTimer = setTimeout(() => {
            const tip = $("tip");
            const detail = document.createElement("small");
            detail.textContent = row.dataset.detail;
            tip.replaceChildren(text.textContent, detail);
            tip.hidden = false;
            const rect = row.getBoundingClientRect();
            const below = rect.bottom + 6 + tip.offsetHeight <= innerHeight;
            tip.style.left = Math.max(12, Math.min(rect.left, innerWidth - tip.offsetWidth - 12)) + "px";
            tip.style.top = (below ? rect.bottom + 6 : rect.top - 6 - tip.offsetHeight) + "px";
          }, 450);
        }

        // Browsers send hover events only after a scroll settles, so while the list
        // scrolls, each frame looks up the row under the last pointer position.
        let pointer = null;
        let scrollFrame = 0;
        messages.addEventListener("pointermove", (event) => {
          pointer = { x: event.clientX, y: event.clientY };
          hover(event.target.closest(".message"));
        });
        messages.addEventListener("pointerleave", () => { pointer = null; hover(null); });
        messages.addEventListener("scroll", () => {
          if (!pointer || scrollFrame) return;
          scrollFrame = requestAnimationFrame(() => {
            scrollFrame = 0;
            if (!pointer) return;
            const under = document.elementFromPoint(pointer.x, pointer.y);
            hover(under && messages.contains(under) ? under.closest(".message") : null);
          });
        });

        // Page events.

        // Clicking anywhere outside the card closes it. A pool's own click handler toggles it.
        document.addEventListener("pointerdown", (event) => {
          if (event.target.closest(".activity-button, .activity-card")) return;
          closeActivity();
          const pool = event.target.closest(".pool");
          if (state.selected && !$("peek").contains(event.target) && !(pool && onTrack(pool.dataset.name, event))) closePeek();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key !== "Escape") return;
          if (activityPool) closeActivity();
          else if (state.selected) closePeek();
        });
        window.addEventListener("scroll", () => { if (activityPool) placeActivity(); }, { capture: true, passive: true });
        window.addEventListener("resize", () => { if (activityPool) placeActivity(); });
        $("path").addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(directoryPath());
            $("copied").hidden = false;
            setTimeout(() => { $("copied").hidden = true; }, 1200);
          } catch (_) { /* Clipboard needs a secure context; the title still shows the path. */ }
        });
        // Capture catches scrolling inside the map as well as the page.
        window.addEventListener("scroll", fitPeek, { capture: true, passive: true });
        window.addEventListener("resize", () => {
          fitPeek();
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => { if (state.topology != null) relayout(); }, 180);
        });
        // A hidden tab does no work. Its first snapshot back brings the map current.
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") { startList(); refreshActivity(); }
          else { stopList(); stopActivity(); }
        });

        function showError(error) {
          $("map-error").textContent = String(error.message || error);
          setStatus("Map unavailable", true);
        }

        // Waits for the fonts before the first layout, because ring sizes come from
        // measured label widths.
        async function boot() {
          if (location.protocol === "file:") {
            showError(new Error("Open this page through a running Plasmite server at http://127.0.0.1:9700/ui/map."));
            return;
          }
          try {
            const session = await fetch("/v0/browser/session", { cache: "no-store" });
            if (!session.ok) { location.assign("/ui"); return; }
            const identity = await session.json();
            const actions = $("actions");
            if (identity.local) {
              const access = document.createElement("a");
              access.href = "/access";
              access.textContent = "Access";
              actions.append(access);
            } else {
              const logout = document.createElement("button");
              logout.type = "button";
              logout.textContent = "Log out";
              logout.addEventListener("click", async () => {
                await fetch("/v0/browser/session", { method: "DELETE" });
                location.assign("/ui");
              });
              actions.append(logout);
            }
          } catch (error) { showError(error); return; }
          await document.fonts.ready;
          $("machine-name").textContent = location.host;
          state.requested = new URLSearchParams(location.search).get("pool");
          startList();
          refreshActivity();
        }

        boot();
      })();
    </script>
  </body>
</html>
