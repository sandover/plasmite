<!--
Purpose: The pools in one served directory, live, and the sign-in form for a key.
Role: Browser client for the pool change stream; `/ui/pools/{name}` is pool.html.
Invariants: No framework runtime, no build step, and no local JS package dependencies.
Invariants: Pool names are rendered as text (never injected as HTML).
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plasmite UI</title>
    <style>
      :root {
        --bg: #15191f;
        --panel: #1f232b;
        --panel-2: #252b36;
        --text: #e9edf1;
        --muted: #9aa9b8;
        --line: #394657;
        --ok: #74d7b2;
        --warn: #e8bc72;
        --error: #f08383;
        --accent: #83c5d7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-size: 20px;
        background: radial-gradient(circle at 30% -20%, #263543, transparent 55%), var(--bg);
        color: var(--text);
        font-family: "Inconsolata", "Menlo", "Consolas", "DejaVu Sans Mono", monospace;
      }

      a,
      a:visited {
        color: var(--accent);
      }

      .topbar {
        display: flex;
        align-items: baseline;
        gap: 22px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        background: #1a2028;
        font: 15px/1.45 "Menlo", "Consolas", "DejaVu Sans Mono", monospace;
      }

      .topbar .brand { color: var(--text); font-size: 14px; letter-spacing: .11em; text-decoration: none; }
      .topbar nav { display: flex; align-items: baseline; gap: 16px; }
      .topbar nav a { text-decoration: none; color: var(--muted); }
      .topbar nav a[aria-current="page"] { color: var(--text); }
      .topbar .actions { margin-left: auto; display: flex; gap: 14px; font-size: 12px; }
      .topbar .where { color: var(--muted); }
      .topbar .where.local { color: var(--warn); }
      .topbar .actions a { text-decoration: none; }
      .topbar .actions button { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; }

      .app {
        width: min(1100px, 100% - 2rem);
        margin: 1rem auto 2rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }

      .app { font-size: 16px; }

      .card {
        background: linear-gradient(180deg, var(--panel), #1a1f28);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .muted {
        color: var(--muted);
      }

      button,
      input {
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        font-family: inherit;
        padding: 0.45rem 0.6rem;
      }

      button {
        cursor: pointer;
      }

      button:hover {
        border-color: #4a5570;
      }

      input {
        width: 14rem;
      }

      .body {
        padding: 1rem;
      }

      /* --- Pool list: one row per pool, like `plasmite pool list` --- */

      .list h1 { display: flex; gap: 12px; align-items: baseline; margin: 8px 0 18px; font-size: 20px; font-weight: 600; }
      .list h1 .count { color: var(--muted); font-weight: 400; }
      .list h1 .reconnecting { color: var(--warn); font-size: 12px; font-weight: 400; }
      .summary { display: grid; grid-template-columns: 6.5em 1fr; gap: 12px 0; align-items: baseline; margin: 0 0 28px; }
      .summary dt { color: var(--muted); font-size: 12px; }
      .summary dd { margin: 0; min-width: 0; display: flex; gap: 10px; align-items: baseline; }
      /* The directory: parent folders muted, its own name bright. It breaks only after a
         slash, like a breadcrumb, so no folder name is split or cut. Click copies it. */
      .path {
        display: block; max-width: 100%; padding: 2px 6px; margin: 0 -6px; border: 0; border-radius: 5px;
        background: none; color: var(--text); font-size: 14px; text-align: left; overflow-wrap: anywhere;
      }
      .path .parent { color: var(--muted); }
      .path strong { font-weight: 600; }
      .path:hover, .path:focus-visible { background: #27313e; border: 0; outline: none; }
      .copied { color: var(--ok); font-size: 11px; }

      /* Each row is a link over subgrid cells, so the whole row opens the pool. */
      .pools {
        --columns: minmax(8rem, 1fr) repeat(5, max-content);
        display: grid; grid-template-columns: var(--columns); column-gap: 28px;
        font-variant-numeric: tabular-nums;
      }
      .pools > * { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: baseline; }
      .pools-head { padding: 0 10px 6px; color: var(--muted); font-size: 12px; }
      .pools-head button {
        padding: 0; border: 0; border-radius: 0; background: none; color: inherit; font: inherit; white-space: nowrap;
      }
      .pools-head button:hover, .pools-head button:focus-visible { color: var(--text); outline: none; }
      .pools-head [aria-sort] button { color: var(--text); }
      .pool-row {
        padding: 9px 10px; border-top: 1px solid #2c3643; color: var(--text); text-decoration: none;
      }
      a.pool-row:visited { color: var(--text); }
      .pool-row:hover, .pool-row:focus-visible { background: #1f2630; outline: none; }
      .pool-row:focus-visible { box-shadow: inset 2px 0 var(--accent); }
      .pool-row .name { font-weight: 600; overflow-wrap: anywhere; }
      .pool-row:hover .name, .pool-row:focus-visible .name { color: var(--accent); }
      .pools .num { text-align: right; white-space: nowrap; }
      .pools .none, .pools .seq { color: var(--muted); }
      .pools .fresh { color: var(--ok); }
      .list .empty { color: var(--muted); padding: 12px 10px; border-top: 1px solid #2c3643; }
      .list .empty code { color: var(--text); }
      .list .error { color: var(--error); }

      @media (max-width: 760px) {
        .pools { --columns: minmax(6rem, 1fr) repeat(3, max-content); column-gap: 18px; }
        .pools .c-oldest, .pools .c-newest { display: none; }
      }
      @media (max-width: 480px) {
        .pools { --columns: minmax(5rem, 1fr) repeat(2, max-content); column-gap: 14px; }
        .pools .c-size { display: none; }
        .summary { grid-template-columns: 1fr; gap: 4px 0; }
      }

      .error {
        color: var(--error);
      }

      @media (max-width: 720px) {
        .app {
          width: calc(100% - 1rem);
          margin-top: 0.6rem;
        }

        .body {
          padding: 0.7rem;
        }

        input {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/ui/map">PLASMITE</a>
      <nav aria-label="Views">
        <a href="/ui" aria-current="page">Pools</a>
        <a href="/ui/map">Map</a>
        <!-- Access shows only on the server machine; the page unhides it for a local session. -->
        <a href="/access" id="nav-access" hidden>Access</a>
      </nav>
      <span class="actions" id="actions"></span>
    </header>
    <main id="app" class="app" aria-live="polite"></main>
    <script>
      (() => {
        const app = document.getElementById("app");
        const params = new URLSearchParams(window.location.search);

        const state = {
          local: false,
          stopped: false,
        };

        /* ---- Utility functions ---- */

        function renderLogin(message) {
          state.stopped = true;
          document.getElementById('actions').replaceChildren();
          app.textContent = '';
          var card = document.createElement('section');
          card.className = 'card';
          card.innerHTML = '<div class="body"><p>Enter the access key for this server.</p>' +
            '<form data-login><input type="password" autocomplete="off" aria-label="Access key" required /> ' +
            '<button type="submit">Connect</button></form><p class="error" data-login-error></p></div>';
          app.appendChild(card);
          card.querySelector('[data-login-error]').textContent = message || '';
          card.querySelector('[data-login]').addEventListener('submit', async function (event) {
            event.preventDefault();
            var input = card.querySelector('input');
            var key = input.value.trim();
            input.value = '';
            try {
              var response = await fetch('/v0/browser/session', {
                method: 'POST', headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ access_key: key })
              });
              key = '';
              if (!response.ok) throw new Error('Access key was not accepted.');
              state.stopped = false;
              if (returnToNext()) return;
              renderActions();
              bootList();
            } catch (err) { card.querySelector('[data-login-error]').textContent = String(err.message || err); }
          });
        }

        async function logout() {
          state.stopped = true;
          await fetch('/v0/browser/session', { method: 'DELETE' });
          renderLogin('Signed out.');
        }

        function renderActions() {
          var actions = document.getElementById('actions');
          actions.replaceChildren();
          document.getElementById('nav-access').hidden = !state.local;
          // Name where this view is: this machine, or the server a key reaches.
          var where = document.createElement('span');
          where.className = state.local ? 'where local' : 'where';
          where.textContent = state.local ? 'Local' : window.location.hostname;
          if (state.local) where.title = 'No key needed';
          actions.appendChild(where);
          document.title = 'Pools \u00b7 ' + (state.local ? 'local' : window.location.hostname);
          if (!state.local) {
            var button = document.createElement('button');
            button.type = 'button';
            button.textContent = 'Log out';
            button.addEventListener('click', logout);
            actions.appendChild(button);
          }
        }

        function pad2(n) {
          return n < 10 ? "0" + n : String(n);
        }

        function formatRelativeTime(isoString) {
          if (!isoString) return "";
          const date = new Date(isoString);
          if (isNaN(date.getTime())) return isoString;
          const nowMs = Date.now();
          const diffMs = nowMs - date.getTime();
          if (diffMs < 0) return "just now";
          const diffS = Math.floor(diffMs / 1000);
          if (diffS < 5) return "just now";
          if (diffS < 60) return diffS + "s ago";
          const diffM = Math.floor(diffS / 60);
          if (diffM < 60) return diffM + "m ago";
          const diffH = Math.floor(diffM / 60);
          if (diffH < 24) return diffH + "h ago";
          const diffD = Math.floor(diffH / 24);
          if (diffD === 1) {
            return "yesterday " + pad2(date.getHours()) + ":" + pad2(date.getMinutes());
          }
          var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
          return months[date.getMonth()] + " " + date.getDate() + " " + pad2(date.getHours()) + ":" + pad2(date.getMinutes());
        }

        // Binary units, as the CLI's --size uses them; the map formats sizes the same way.
        function formatHumanBytes(bytes) {
          if (bytes == null || !isFinite(bytes)) return "-";
          var units = ["B", "KB", "MB", "GB", "TB"];
          var value = bytes, unit = 0;
          while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
          return (unit ? Number(value.toFixed(1)) : value) + " " + units[unit];
        }

        /* ---- Pool list ---- */

        // The list follows the server's pool stream; `pools` stays null until the
        // first snapshot arrives. Sorting and the copied note are the page's own.
        var list = { pools: null, error: "", reconnecting: false, dir: "", sort: "name", desc: false, copiedUntil: 0, frame: "", section: null, rows: new Map() };

        // Columns, in the CLI's order. Numeric columns sort high first on the first click.
        var poolColumns = [
          { key: "name", label: "Name" },
          { key: "messages", label: "Messages", num: true },
          { key: "oldest", label: "Oldest", num: true },
          { key: "newest", label: "Newest", num: true },
          { key: "written", label: "Last write", num: true },
          { key: "size", label: "Size", num: true },
        ];

        function poolFacts(pool) {
          var metrics = pool.metrics || {};
          var bounds = pool.bounds || {};
          var newest = metrics.age && metrics.age.newest_time;
          var written = newest ? new Date(newest).getTime() : NaN;
          return {
            name: pool.name,
            messages: metrics.message_count != null ? metrics.message_count : null,
            oldest: bounds.oldest != null ? bounds.oldest : null,
            newest: bounds.newest != null ? bounds.newest : null,
            written: isFinite(written) ? written : null,
            size: pool.file_size != null ? pool.file_size : null,
          };
        }

        function poolDirectory() {
          if (list.dir) return list.dir;
          var path = list.pools && list.pools[0] && list.pools[0].path;
          return path ? path.replace(/[\\/][^\\/]*$/, "") : "";
        }

        // The directory as a copy button that breaks only after a slash.
        function directoryMarkup(dir) {
          var cut = Math.max(dir.lastIndexOf("/"), dir.lastIndexOf("\\")) + 1;
          var parent = dir.slice(0, cut).split(/(?<=[\\/])/).map(escapeHtml).join("<wbr>");
          return '<button type="button" class="path" data-copy-dir title="' + escapeAttr(dir) + '" aria-label="Copy directory path">' +
            '<span class="parent">' + parent + '<wbr></span><strong>' + escapeHtml(dir.slice(cut)) + '</strong></button>' +
            (Date.now() < list.copiedUntil ? '<span class="copied">copied</span>' : '');
        }

        function sortedFacts() {
          var key = list.sort, sign = list.desc ? -1 : 1;
          return list.pools.map(poolFacts).sort(function (a, b) {
            var x = a[key], y = b[key];
            if (x === y) return a.name.localeCompare(b.name);
            if (x == null) return 1;
            if (y == null) return -1;
            return sign * (key === "name" ? x.localeCompare(y) : x - y);
          });
        }

        function poolCellsMarkup(f) {
          var none = '<span class="none">–</span>';
          var count = function (n) { return n == null ? none : n.toLocaleString(); };
          var seq = function (n) { return n == null ? none : '<span class="seq">#</span>' + n.toLocaleString(); };
          var fresh = f.written != null && Date.now() - f.written < 5000;
          var written = f.written == null ? (f.messages === 0 ? '<span class="none">never</span>' : none)
            : '<span class="' + (fresh ? "fresh" : "") + '">' + escapeHtml(formatRelativeTime(new Date(f.written).toISOString())) + '</span>';
          return '<span role="cell" class="name">' + escapeHtml(f.name) + '</span>' +
            '<span role="cell" class="num">' + count(f.messages) + '</span>' +
            '<span role="cell" class="num c-oldest">' + seq(f.oldest) + '</span>' +
            '<span role="cell" class="num c-newest">' + seq(f.newest) + '</span>' +
            '<span role="cell" class="num">' + written + '</span>' +
            '<span role="cell" class="num c-size">' + escapeHtml(formatHumanBytes(f.size)) + '</span>';
        }

        function poolHeadMarkup() {
          return '<div class="pools-head" role="row">' + poolColumns.map(function (column) {
            var active = column.key === list.sort;
            var arrow = active ? (list.desc ? " ↓" : " ↑") : "";
            return '<span role="columnheader" class="' + (column.num ? "num " : "") + "c-" + column.key + '"' +
              (active ? ' aria-sort="' + (list.desc ? "descending" : "ascending") + '"' : "") + '>' +
              '<button type="button" data-sort="' + column.key + '">' + column.label + arrow + '</button></span>';
          }).join("") + '</div>';
        }

        // Writes the page around the rows only when it changed, and keeps one link
        // per pool, changing only its cells. A redraw then never takes focus or a
        // click away from the row under the pointer.
        function renderPoolList() {
          var pools = list.pools;
          var dir = poolDirectory();
          var body = "";
          if (pools && pools.length) {
            body = '<div class="pools" role="table" aria-label="Pools">' + poolHeadMarkup() + '</div>';
          } else if (pools) {
            body = '<p class="empty">No pools yet. Create one with <code>plasmite ' +
              (dir ? '--dir ' + escapeHtml(/\s/.test(dir) ? '"' + dir + '"' : dir) + ' ' : '') + 'pool create NAME</code></p>';
          }
          var frame = '<section class="list">' +
            '<h1>Pools' + (pools ? ' <span class="count">' + pools.length + '</span>' : '') +
              (list.reconnecting ? ' <span class="reconnecting">reconnecting</span>' : '') + '</h1>' +
            (dir ? '<dl class="summary"><dt>Directory</dt><dd>' + directoryMarkup(dir) + '</dd></dl>' : '') +
            (list.error ? '<p class="error">' + escapeHtml(list.error) + '</p>' : '') +
            body + '</section>';
          if (frame !== list.frame || app.firstElementChild !== list.section) {
            list.frame = frame;
            app.innerHTML = frame;
            list.section = app.firstElementChild;
          }
          var table = list.section.querySelector(".pools");
          if (!table) { list.rows.clear(); return; }
          var seen = new Set();
          sortedFacts().forEach(function (f, i) {
            var row = list.rows.get(f.name);
            if (!row) {
              row = document.createElement("a");
              row.className = "pool-row";
              row.setAttribute("role", "row");
              row.href = "/ui/pools/" + encodeURIComponent(f.name);
              list.rows.set(f.name, row);
            }
            var cells = poolCellsMarkup(f);
            if (row.dataset.cells !== cells) { row.innerHTML = cells; row.dataset.cells = cells; }
            // Child 0 is the header row.
            if (table.children[i + 1] !== row) table.insertBefore(row, table.children[i + 1] || null);
            seen.add(f.name);
          });
          list.rows.forEach(function (row, name) {
            if (!seen.has(name)) { row.remove(); list.rows.delete(name); }
          });
        }

        app.addEventListener("click", async function (event) {
          var sort = event.target.closest("[data-sort]");
          if (sort) {
            var column = poolColumns.find(function (c) { return c.key === sort.dataset.sort; });
            list.desc = list.sort === column.key ? !list.desc : Boolean(column.num);
            list.sort = column.key;
            renderPoolList();
            var again = app.querySelector('[data-sort="' + column.key + '"]');
            if (again) again.focus();
            return;
          }
          if (event.target.closest("[data-copy-dir]")) {
            try {
              await navigator.clipboard.writeText(poolDirectory());
              list.copiedUntil = Date.now() + 1200;
              renderPoolList();
              setTimeout(renderPoolList, 1250);
            } catch (_) { /* Clipboard needs a secure context; the title still shows the path. */ }
          }
        });

        /* ---- Helpers ---- */

        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
        }

        function escapeAttr(value) {
          return escapeHtml(value).replaceAll("`", "&#96;");
        }

        /* ---- Data fetching ---- */

        // The first load shows a loading state; later refreshes keep the current
        // list on screen until the new one arrives.
        // Follows the server's pool snapshots; the server sends one when anything
        // but message ages changes, and the page ages the times itself.
        async function followPoolList() {
          while (!state.stopped) {
            try {
              var response = await fetch("/v0/ui/pools/stream", { cache: "no-store" });
              if (response.status === 401) {
                renderLogin('Session ended. Enter the key again.');
                return;
              }
              if (!response.ok || !response.body) throw new Error("Pool list failed (" + response.status + ")");
              var reader = response.body.getReader();
              var decoder = new TextDecoder();
              var buffer = "";
              while (!state.stopped) {
                var part = await reader.read();
                if (part.done) break;
                buffer += decoder.decode(part.value, { stream: true }).replace(/\r\n/g, "\n");
                var blocks = buffer.split("\n\n");
                buffer = blocks.pop();
                for (var i = 0; i < blocks.length; i++) {
                  var lines = blocks[i].split("\n");
                  var name = "", data = "";
                  for (var j = 0; j < lines.length; j++) {
                    if (lines[j].startsWith("event:")) name = lines[j].slice(6).trim();
                    else if (lines[j].startsWith("data:")) data += (data ? "\n" : "") + lines[j].slice(5).trimStart();
                  }
                  if (name === "error") throw new Error("Pool list stream failed.");
                  if (name !== "pools") continue;
                  list.pools = JSON.parse(data).pools || [];
                  list.error = "";
                  list.reconnecting = false;
                  renderPoolList();
                }
              }
            } catch (err) {
              if (!list.pools) list.error = String(err.message || err);
            }
            if (state.stopped) return;
            list.reconnecting = Boolean(list.pools);
            renderPoolList();
            await wait(1000);
          }
        }

        function wait(ms) {
          return new Promise(function (resolve) { setTimeout(resolve, ms); });
        }

        /* ---- Boot ---- */

        async function boot() {
          if (window.location.protocol === 'file:') {
            app.innerHTML = '<section class="card">' +
              '<div class="body"><p>This is the UI source file. Open the page through a running Plasmite server.</p>' +
              '<p>Start one with <code>plasmite --dir ./shared serve</code>, then open ' +
              '<code>http://127.0.0.1:9700/ui</code>.</p></div></section>';
            return;
          }
          if (params.has('token')) {
            params.delete('token');
            history.replaceState(null, '', window.location.pathname + (params.size ? '?' + params.toString() : ''));
          }
          try {
            var session = await fetch('/v0/browser/session', { cache: 'no-store' });
            if (!session.ok) { renderLogin(''); return; }
            var identity = await session.json();
            state.local = Boolean(identity.local);
            renderActions();
          } catch (err) { renderLogin('Could not reach the server.'); return; }
          if (returnToNext()) return;
          bootList();
        }

        async function bootList() {
          if (state.local && !list.dir) {
            // Locally, the server names its directory even when it has no pools yet.
            try { list.dir = (await (await fetch('/v0/access/status', { cache: 'no-store' })).json()).pool_dir || ""; }
            catch (_) { /* The pools' own paths name it once there are any. */ }
          }
          renderPoolList();
          followPoolList();
          // Ages the relative times between snapshots; unchanged markup is not rewritten.
          if (!list.ticking) list.ticking = setInterval(function () { if (!state.stopped) renderPoolList(); }, 1000);
        }

        // Another page sends the reader here to sign in, then back. Only a page of
        // this UI can be the way back, so the link cannot lead off the server.
        function returnToNext() {
          var next = params.get('next');
          if (!next || !/^\/ui\/[^/\\]/.test(next)) return false;
          location.replace(next);
          return true;
        }

        boot();
      })();
    </script>
  </body>
</html>
