<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plasmite access</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #16181d; color: #e8e9ed; }
      body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
      a { color: #91c2f5; }
      section { background: #1f232b; border: 1px solid #343c4b; border-radius: 10px; margin: 1rem 0; padding: 1rem; }
      h1, h2 { margin: 0 0 .7rem; }
      h1 { font-size: 1.5rem; } h2 { font-size: 1.1rem; }
      p { margin: .5rem 0; } .muted { color: #a5acbb; }
      input, button, textarea { font: inherit; background: #252b36; color: inherit; border: 1px solid #526076; border-radius: 5px; padding: .4rem .6rem; }
      button { cursor: pointer; } button:disabled { opacity: .5; cursor: default; }
      input { max-width: 100%; }
      textarea { width: 100%; height: 5rem; resize: vertical; }
      .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; padding: .65rem 0; border-top: 1px solid #343c4b; }
      .row > span { flex: 1; min-width: 12rem; }
      code { overflow-wrap: anywhere; }
      .error { color: #ef9999; }
    </style>
  </head>
  <body>
    <header><a href="/ui">← Pools</a><h1>Access</h1></header>
    <section>
      <h2>Server</h2>
      <div id="settings" class="muted">Loading server settings…</div>
    </section>
    <section>
      <h2>Invite</h2>
      <p>Give the access key to someone through a private channel. It appears here only once.</p>
      <form id="invite-form">
        <label for="name">Name</label>
        <input id="name" name="name" maxlength="128" required autocomplete="off" placeholder="Person or device">
        <button type="submit">Create key</button>
      </form>
      <div id="new-key" hidden><p>New access key</p><textarea readonly aria-label="New access key"></textarea></div>
    </section>
    <section>
      <h2>Keys</h2>
      <div id="keys" class="muted">Loading keys…</div>
    </section>
    <p id="notice" role="status"></p>
    <script>
      (() => {
        const settings = document.getElementById('settings');
        const keys = document.getElementById('keys');
        const notice = document.getElementById('notice');
        const form = document.getElementById('invite-form');
        let fingerprint = null;

        function line(parent, label, value) {
          const p = document.createElement('p');
          const strong = document.createElement('strong');
          strong.textContent = label + ': ';
          p.append(strong, document.createTextNode(value));
          parent.append(p);
        }

        async function request(url, options = {}) {
          const response = await fetch(url, { cache: 'no-store', ...options });
          const body = await response.json();
          if (!response.ok) throw new Error(body.error?.message || `Request failed (${response.status})`);
          return body;
        }

        async function loadStatus() {
          const status = await request('/v0/access/status');
          settings.textContent = '';
          fingerprint = status.server_fingerprint || null;
          line(settings, 'Local page', window.location.origin);
          if (status.shared_address) line(settings, 'Shared address', status.shared_address);
          if (fingerprint) line(settings, 'Server fingerprint', fingerprint);
          if (status.next_action) line(settings, 'Next step', status.next_action);
          if (!fingerprint) form.querySelector('button').disabled = true;
          const help = document.createElement('p');
          help.className = 'muted';
          help.textContent = 'Change the address or certificate in the serve command or configuration, then restart the server.';
          settings.append(help);
        }

        function date(seconds) {
          return seconds == null ? 'Not recorded' : new Date(seconds * 1000).toLocaleString();
        }

        async function loadKeys() {
          if (!fingerprint) return;
          const body = await request('/v0/access/keys', {
            headers: { 'x-plasmite-server-fingerprint': fingerprint }
          });
          keys.textContent = '';
          if (!body.keys.length) { keys.textContent = 'No keys yet.'; return; }
          for (const key of body.keys) {
            const row = document.createElement('div');
            row.className = 'row';
            const summary = document.createElement('span');
            const name = document.createElement('strong');
            name.textContent = key.name;
            const detail = document.createElement('small');
            detail.textContent = ` · ${key.revoked ? 'Revoked' : 'Active'} · Created ${date(key.created_at)} · Last used ${date(key.last_used_at)} · ${key.id.slice(0, 12)}`;
            summary.append(name, detail);
            row.append(summary);
            if (!key.revoked) {
              const revoke = document.createElement('button');
              revoke.textContent = 'Revoke';
              revoke.addEventListener('click', async () => {
                revoke.disabled = true;
                try {
                  await request('/v0/access/revoke', {
                    method: 'POST', headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ id: key.id, server_fingerprint: fingerprint })
                  });
                  notice.textContent = `${key.name} revoked.`;
                  await loadKeys();
                } catch (error) { notice.textContent = error.message; revoke.disabled = false; }
              });
              row.append(revoke);
            }
            keys.append(row);
          }
        }

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const name = form.elements.name.value.trim();
          if (!name || !fingerprint) return;
          const button = form.querySelector('button');
          button.disabled = true;
          try {
            const body = await request('/v0/access/invite', {
              method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ name, server_fingerprint: fingerprint })
            });
            const newKey = document.getElementById('new-key');
            newKey.hidden = false;
            newKey.querySelector('textarea').value = body.access_key;
            form.reset();
            notice.textContent = 'Key created. Copy it now; the server will not show it again.';
            await loadKeys();
          } catch (error) { notice.textContent = error.message; }
          finally { button.disabled = false; }
        });

        loadStatus().then(loadKeys).catch(error => {
          notice.className = 'error';
          notice.textContent = error.message;
        });
      })();
    </script>
  </body>
</html>
